<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amtrak Route Map — LNK to OTM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',monospace;background:#fff;color:#000;padding:20px}
h1{text-align:center;font-size:22px;margin-bottom:4px;letter-spacing:1px}
.subtitle{text-align:center;font-size:13px;margin-bottom:20px;color:#444}
.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:20px;font-size:11px;border:1px solid #bbb;padding:10px 14px;background:#fafafa}
.legend-item{display:flex;align-items:center;gap:5px}
.toolbar{position:sticky;top:0;z-index:100;background:#f5f5f5;border:1px solid #ccc;border-radius:6px;padding:6px 12px;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar button{font-family:'Courier New',monospace;font-size:14px;padding:4px 12px;border:1px solid #999;border-radius:4px;background:#fff;cursor:pointer;min-width:36px}
.toolbar button:hover{background:#e8e8e8}
.toolbar .zoom-label{font-size:12px;color:#555;min-width:48px;text-align:center}
.toolbar .sep{width:1px;height:22px;background:#ccc;margin:0 4px}
.toolbar .hint{font-size:10px;color:#888;margin-left:auto}
.segment-header{background:#1a1a2e;color:#fff;padding:8px 16px;font-size:15px;font-weight:bold;letter-spacing:1px;margin-top:30px;display:flex;justify-content:space-between;align-items:center}
.segment-header .rr{font-size:11px;font-weight:normal;color:#aaa}
#map-container{transform-origin:top left;transition:transform .15s ease}
svg{display:block;border:1px solid #ccc;border-top:none;background:#fff}
.tooltip{position:fixed;pointer-events:none;background:rgba(0,0,0,.85);color:#fff;padding:6px 10px;border-radius:4px;font-size:12px;display:none;z-index:999;max-width:260px;line-height:1.4}
@media print{
  body{padding:10px}.toolbar,.tooltip{display:none!important}
  #map-container{transform:none!important}
  .legend{border:1px solid #000;break-inside:avoid}
  .segment-header{background:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:avoid}
  svg{break-inside:avoid;page-break-inside:avoid;max-width:100%!important}
  .segment-wrapper{break-inside:avoid;page-break-inside:avoid}
}
@page{size:letter portrait;margin:.5in}
@media(max-width:700px){body{padding:8px}h1{font-size:17px}.legend{font-size:9px;gap:8px}.segment-header{font-size:13px}.toolbar .hint{display:none}}
</style>
</head>
<body>
<h1>AMTRAK ROUTE MAP</h1>
<div class="subtitle">Lincoln, NE (LNK) — Omaha, NE (OMA) — Creston, IA (CRN) — Osceola, IA (OSC) — Ottumwa, IA (OTM)<br>California Zephyr Corridor</div>

<div class="legend">
  <div class="legend-item"><svg width="30" height="12"><line x1="2" y1="6" x2="28" y2="6" stroke="#222" stroke-width="3"/></svg> Single Track</div>
  <div class="legend-item"><svg width="30" height="12"><line x1="2" y1="3" x2="28" y2="3" stroke="#222" stroke-width="2.5"/><line x1="2" y1="9" x2="28" y2="9" stroke="#222" stroke-width="2.5"/></svg> Double Track</div>
  <div class="legend-item"><svg width="40" height="18"><line x1="4" y1="0" x2="4" y2="18" stroke="#222" stroke-width="2.5"/><line x1="4" y1="3" x2="16" y2="5" stroke="#222" stroke-width="1.5"/><line x1="16" y1="5" x2="16" y2="13" stroke="#222" stroke-width="1.5"/><line x1="16" y1="13" x2="4" y2="15" stroke="#222" stroke-width="1.5"/></svg> Passing Siding</div>
  <div class="legend-item"><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#d32f2f" stroke="#b71c1c" stroke-width="1.5"/></svg> Amtrak Station</div>
  <div class="legend-item"><svg width="16" height="16"><polygon points="8,2 14,8 8,14 2,8" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/></svg> Control Point</div>
  <div class="legend-item"><svg width="30" height="12"><path d="M2,6 Q10,2 18,6 Q26,10 30,6" fill="none" stroke="#1976d2" stroke-width="2"/></svg> River/Bridge</div>
  <div class="legend-item"><span style="color:#e65100;font-weight:bold">40</span> Speed (mph)</div>
</div>

<div class="toolbar">
  <button id="zi" title="Zoom in">+</button>
  <span class="zoom-label" id="zl">100%</span>
  <button id="zo" title="Zoom out">&minus;</button>
  <button id="zr">Reset</button>
  <div class="sep"></div>
  <button id="zf">Fit Width</button>
  <div class="sep"></div>
  <button id="bp" title="Print">Print</button>
  <span class="hint">Ctrl+scroll to zoom &middot; Pinch on touch &middot; Ctrl+P to print</span>
</div>

<div id="map-container"></div>
<div class="tooltip" id="tt"></div>

<script>

function Y(mp){return PAD+mp*PX}
function mkSVG(tag){return document.createElementNS('http://www.w3.org/2000/svg',tag)}
function addEl(svg,tag,attrs){const e=mkSVG(tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);svg.appendChild(e);return e}
function addText(svg,x,y,txt,sz,fill,anchor,bold){
  const t=addEl(svg,'text',{x,y,'font-size':sz||11,fill:fill||'#000','font-family':"'Courier New',monospace",'text-anchor':anchor||'start'});
  t.textContent=txt;if(bold)t.style.fontWeight='bold';return t;
}
function addTip(el,html){
  el.style.cursor='pointer';
  el.addEventListener('mouseenter',()=>{tt.innerHTML=html;tt.style.display='block'});
  el.addEventListener('mousemove',e=>{tt.style.left=(e.clientX+12)+'px';tt.style.top=(e.clientY-10)+'px'});
  el.addEventListener('mouseleave',()=>{tt.style.display='none'});
}

function drawSiding(svg,f){
  const y1=Y(f.mp1), y2=Y(f.mp2);
  const x=TX, ox=TX+SO, taper=18;
  // Turnout at top
  addEl(svg,'line',{x1:x,y1:y1,x2:ox,y2:y1+taper,stroke:'#222','stroke-width':2});
  // Parallel siding track
  addEl(svg,'line',{x1:ox,y1:y1+taper,x2:ox,y2:y2-taper,stroke:'#222','stroke-width':2});
  // Turnout at bottom
  addEl(svg,'line',{x1:ox,y1:y2-taper,x2:x,y2:y2,stroke:'#222','stroke-width':2});
  // Turnout diamonds
  const ds=4;
  addEl(svg,'polygon',{points:`${x},${y1-ds} ${x+ds},${y1} ${x},${y1+ds} ${x-ds},${y1}`,fill:'#555',stroke:'#333','stroke-width':1});
  addEl(svg,'polygon',{points:`${x},${y2-ds} ${x+ds},${y2} ${x},${y2+ds} ${x-ds},${y2}`,fill:'#555',stroke:'#333','stroke-width':1});
  // Siding name
  const my=(y1+y2)/2;
  addText(svg,ox+8,my+4,f.name,10,'#333','start');
  // CP labels
  if(f.cpTop) addText(svg,TX+30,y1-4,f.cpTop,9,'#1565c0','start');
  if(f.cpBot) addText(svg,TX+30,y2+13,f.cpBot,9,'#1565c0','start');
  // Speed at turnouts
  if(f.spdTO){
    addText(svg,TX-14,y1+4,f.spdTO+'',10,'#e65100','end',true);
    addText(svg,TX-14,y2+4,f.spdTO+'',10,'#e65100','end',true);
  }
  // Speed on main
  if(f.spdMain) addText(svg,TX-14,my+4,f.spdMain+'',10,'#2e7d32','end',true);
  // Tooltip
  const zone=addEl(svg,'rect',{x:TX-30,y:y1-12,width:SW-TX+10,height:y2-y1+24,fill:'transparent'});
  addTip(zone,`<b>${f.name}</b><br>MP ${f.mp1} to MP ${f.mp2}<br>Main: ${f.spdMain} mph / Turnout: ${f.spdTO} mph<br>${f.cpTop||''} / ${f.cpBot||''}`);
}

function drawStation(svg,f){
  const y=Y(f.mp);
  addEl(svg,'circle',{cx:TX,cy:y,r:9,fill:'#d32f2f',stroke:'#b71c1c','stroke-width':2});
  addEl(svg,'circle',{cx:TX,cy:y,r:3.5,fill:'#fff'});
  addText(svg,TX+18,y+5,`${f.name} (${f.code})`,14,'#000','start',true);
  addText(svg,TX-16,y+4,`MP ${f.mp.toFixed(1)}`,9,'#666','end');
  if(f.note) addText(svg,TX+18,y+18,f.note,9,'#888','start');
  const zone=addEl(svg,'rect',{x:TX-50,y:y-14,width:SW-TX+30,height:34,fill:'transparent'});
  addTip(zone,`<b>${f.name} (${f.code})</b><br>Amtrak Station<br>MP ${f.mp}${f.note?'<br>'+f.note:''}`);
}

function drawCP(svg,f){
  const y=Y(f.mp),s=5;
  addEl(svg,'polygon',{points:`${TX},${y-s} ${TX+s},${y} ${TX},${y+s} ${TX-s},${y}`,fill:'#1565c0',stroke:'#0d47a1','stroke-width':1.5});
  addText(svg,TX+12,y+4,f.name,10,'#1565c0','start');
  if(f.note) addText(svg,TX+12,y+14,f.note,8,'#888','start');
  if(f.spd) addText(svg,TX-14,y+4,f.spd+' mph',10,'#e65100','end',true);
  const zone=addEl(svg,'rect',{x:TX-30,y:y-10,width:200,height:24,fill:'transparent'});
  addTip(zone,`<b>${f.name}</b><br>Control Point${f.spd?'<br>Speed: '+f.spd+' mph':''}${f.note?'<br>'+f.note:''}`);
}

function drawBridge(svg,f){
  const y=Y(f.mp),w=28;
  for(let i=-1;i<=1;i++){
    const yy=y+i*5;
    addEl(svg,'path',{d:`M${TX-w},${yy} Q${TX-w/2},${yy-4} ${TX},${yy} Q${TX+w/2},${yy+4} ${TX+w},${yy}`,fill:'none',stroke:'#1976d2','stroke-width':2.5});
  }
  addText(svg,TX+w+8,y+4,f.name,11,'#1565c0','start');
  if(f.spd) addText(svg,TX-w-8,y+4,f.spd+' mph',10,'#e65100','end',true);
  const zone=addEl(svg,'rect',{x:TX-40,y:y-12,width:260,height:28,fill:'transparent'});
  addTip(zone,`<b>${f.name}</b><br>Bridge / River Crossing${f.spd?'<br>Speed: '+f.spd+' mph':''}`);
}

function drawPoint(svg,f){
  const y=Y(f.mp);
  addEl(svg,'line',{x1:TX-7,y1:y,x2:TX+7,y2:y,stroke:'#555','stroke-width':1.5});
  addText(svg,TX+14,y+4,`${f.mp.toFixed(1)} ${f.name}`,10,'#333','start');
  if(f.spd) addText(svg,TX-14,y+4,f.spd+' mph',10,'#e65100','end',true);
  if(f.note) addText(svg,TX+14,y+15,f.note,8,'#999','start');
  const zone=addEl(svg,'rect',{x:TX-40,y:y-10,width:260,height:28,fill:'transparent'});
  addTip(zone,`<b>${f.name}</b><br>MP ${f.mp.toFixed(1)}${f.spd?'<br>Speed: '+f.spd+' mph':''}${f.note?'<br>'+f.note:''}`);
}

function render(seg){
  const h=PAD*2+seg.miles*PX;
  const wrap=document.createElement('div');wrap.className='segment-wrapper';container.appendChild(wrap);
  const hdr=document.createElement('div');hdr.className='segment-header';
  hdr.innerHTML=`<span>${seg.title}</span><span class="rr">${seg.rr} \u2014 ${seg.miles} mi</span>`;
  wrap.appendChild(hdr);
  const svg=mkSVG('svg');
  svg.setAttribute('width','100%');
  svg.setAttribute('viewBox',`0 0 ${SW} ${h}`);
  svg.setAttribute('preserveAspectRatio','xMidYMin meet');
  svg.style.maxWidth=SW+'px';
  wrap.appendChild(svg);

  // Mile ticks
  for(let m=0;m<=seg.miles;m++){
    const y=Y(m);
    if(m%5===0){
      addEl(svg,'line',{x1:TX-14,y1:y,x2:TX-5,y2:y,stroke:'#bbb','stroke-width':1});
      if(m%10===0) addText(svg,TX-16,y+3,m+'',9,'#aaa','end');
    }
  }

  // Find double track ranges
  let dbl=false,dblStart=0,dblRanges=[];
  for(const f of seg.features){
    if(f.t==='dbl_start'){dbl=true;dblStart=f.mp;}
    if(f.t==='dbl_end'){dbl=false;dblRanges.push([dblStart,f.mp]);}
  }
  if(dbl) dblRanges.push([dblStart,seg.miles]);

  // Single track (full length)
  addEl(svg,'line',{x1:TX,y1:Y(0),x2:TX,y2:Y(seg.miles),stroke:'#222','stroke-width':TW,'stroke-linecap':'round'});

  // Double track overlay
  for(const[s,e]of dblRanges){
    addEl(svg,'line',{x1:TX,y1:Y(s),x2:TX,y2:Y(e),stroke:'#fff','stroke-width':TW+6});
    addEl(svg,'line',{x1:TX-5,y1:Y(s),x2:TX-5,y2:Y(e),stroke:'#222','stroke-width':TW});
    addEl(svg,'line',{x1:TX+5,y1:Y(s),x2:TX+5,y2:Y(e),stroke:'#222','stroke-width':TW});
    for(let m=Math.ceil(s)+1;m<Math.floor(e);m+=2){
      const cy=Y(m);
      addEl(svg,'line',{x1:TX-5,y1:cy-3,x2:TX+5,y2:cy+3,stroke:'#555','stroke-width':1.2});
      addEl(svg,'line',{x1:TX-5,y1:cy+3,x2:TX+5,y2:cy-3,stroke:'#555','stroke-width':1.2});
    }
  }

  // Draw all features
  for(const f of seg.features){
    if(f.t==='station') drawStation(svg,f);
    else if(f.t==='cp') drawCP(svg,f);
    else if(f.t==='bridge') drawBridge(svg,f);
    else if(f.t==='point') drawPoint(svg,f);
    else if(f.t==='siding') drawSiding(svg,f);
  }
}

segments.forEach(s=>render(s));

// ========== ZOOM & PRINT ==========
(function(){
  let z=1;const MN=.25,MX=4,ST=.25;
  const m=document.getElementById('map-container'),l=document.getElementById('zl');
  function az(){z=Math.max(MN,Math.min(MX,z));m.style.transform=`scale(${z})`;m.style.width=(100/z)+'%';l.textContent=Math.round(z*100)+'%';}
  function zi(){z+=ST;az();}function zo(){z-=ST;az();}function zr(){z=1;az();}
  function zf(){const cw=m.parentElement.clientWidth-40;const svgs=m.querySelectorAll('svg');if(!svgs.length)return;const mw=Math.max(...Array.from(svgs).map(s=>+s.getAttribute('viewBox').split(' ')[2]));z=cw/mw;az();}
  document.getElementById('zi').addEventListener('click',zi);
  document.getElementById('zo').addEventListener('click',zo);
  document.getElementById('zr').addEventListener('click',zr);
  document.getElementById('zf').addEventListener('click',zf);
  document.getElementById('bp').addEventListener('click',()=>{const p=z;z=1;az();setTimeout(()=>{window.print();z=p;az();},100);});
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&(e.key==='='||e.key==='+'))  {e.preventDefault();zi();}
    else if((e.ctrlKey||e.metaKey)&&e.key==='-'){e.preventDefault();zo();}
    else if((e.ctrlKey||e.metaKey)&&e.key==='0'){e.preventDefault();zr();}
  });
