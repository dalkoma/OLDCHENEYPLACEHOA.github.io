<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="Jarvis - Your personal AI life manager with calendar, tasks, train tracking, meals, and more." />
    <title>Jarvis - Your Personal AI Assistant</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #060a12; overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      @media (hover: none) and (pointer: coarse) { button, a, [role="button"], input, select, textarea { min-height: 40px; } }
      @media (resolution >= 2dppx) { * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; } }
      @media (orientation: landscape) { #root { transition: none; } }

      /* ===== JARVIS FULL-SCREEN HUD BOOT ===== */
      #jarvis-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(ellipse at center, #0a1020 0%, #060a12 50%, #020406 100%);
        display: flex; align-items: center; justify-content: center;
        transition: opacity 1s ease, visibility 1s ease;
      }
      #jarvis-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }

      /* Subtle grid */
      .hud-grid {
        position: absolute; inset: 0; opacity: 0.03;
        background-image:
          linear-gradient(rgba(0,210,220,1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,210,220,1) 1px, transparent 1px);
        background-size: 50px 50px;
      }

      /* Reactor takes up full viewport */
      .hud-reactor {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      .hud-reactor svg {
        width: min(100vw, 100vh); height: min(100vw, 100vh);
        max-width: 800px; max-height: 800px;
      }

      /* Core glow behind text */
      .hud-core-glow {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 160px; height: 160px; border-radius: 50%;
        background: radial-gradient(circle, rgba(0,210,220,0.3) 0%, rgba(0,210,220,0.1) 30%, transparent 65%);
        filter: blur(15px);
        animation: coreGlow 2.5s ease-in-out infinite;
      }
      @keyframes coreGlow { 0%,100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.4); } }

      /* Center overlay */
      .hud-center {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; z-index: 3;
      }
      .hud-jarvis {
        font-family: 'Orbitron', sans-serif;
        font-size: 22px; font-weight: 700; letter-spacing: 10px;
        color: rgba(0, 225, 235, 0.95);
        text-shadow: 0 0 25px rgba(0,210,220,0.6), 0 0 50px rgba(0,210,220,0.25);
        animation: textGlow 2.5s ease-in-out infinite;
      }
      .hud-clock {
        font-family: 'Orbitron', sans-serif;
        font-size: 14px; font-weight: 400; letter-spacing: 4px;
        color: rgba(0,200,210,0.5); margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }
      @keyframes textGlow { 0%,100% { text-shadow: 0 0 25px rgba(0,210,220,0.6), 0 0 50px rgba(0,210,220,0.25); } 50% { text-shadow: 0 0 40px rgba(0,210,220,0.9), 0 0 80px rgba(0,210,220,0.4); } }

      /* Sonar expanding rings */
      .hud-sonar {
        position: absolute; top: 50%; left: 50%; border-radius: 50%;
        border: 1px solid rgba(0,210,220,0.1);
        transform: translate(-50%, -50%) scale(0.4);
        animation: sonarExpand 4s ease-out infinite;
        pointer-events: none;
      }
      .hud-sonar:nth-child(2) { width: 110%; height: 110%; animation-delay: 0s; }
      .hud-sonar:nth-child(3) { width: 130%; height: 130%; animation-delay: 1s; }
      .hud-sonar:nth-child(4) { width: 155%; height: 155%; animation-delay: 2s; }
      .hud-sonar:nth-child(5) { width: 185%; height: 185%; animation-delay: 3s; }
      @keyframes sonarExpand {
        0% { transform: translate(-50%,-50%) scale(0.4); opacity: 0; }
        12% { opacity: 0.35; }
        100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
      }

      /* Particles */
      .splash-particle { position: absolute; border-radius: 50%; background: rgba(0,210,220,0.2); animation: pFloat linear infinite; pointer-events: none; }
      @keyframes pFloat { 0% { transform: translateY(0) scale(1); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.3; } 100% { transform: translateY(-100vh) scale(0.2); opacity: 0; } }

      /* Data feed overlay (bottom left) */
      .splash-feed {
        position: absolute; bottom: 80px; left: 20px; right: 20px;
        max-width: 400px;
        display: flex; flex-direction: column; gap: 4px;
        z-index: 5;
      }
      .splash-feed-item {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 12px; border-radius: 6px;
        background: rgba(0,15,25,0.85); border: 1px solid rgba(0,210,220,0.1);
        backdrop-filter: blur(6px);
        opacity: 0; transform: translateX(-15px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .splash-feed-item.show { opacity: 1; transform: translateX(0); }
      .splash-feed-icon { font-size: 12px; flex-shrink: 0; width: 18px; text-align: center; }
      .splash-feed-label { color: rgba(0,210,220,0.45); font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'Orbitron', sans-serif; }
      .splash-feed-value { color: #b0d8dc; font-size: 10px; line-height: 1.3; }
      .splash-feed-value .hi { color: #00e5ef; }
      .splash-feed-value .warn { color: #fdcb6e; }
      .splash-feed-value .accent { color: #70d0d5; }

      /* Greeting overlay (top) */
      .splash-top {
        position: absolute; top: 40px; left: 0; right: 0;
        text-align: center; z-index: 5;
        animation: textIn 1s ease 0.3s both;
      }
      .splash-greeting { color: #c0e8ec; font-size: 16px; font-weight: 500; margin-bottom: 2px; }
      .splash-date { color: rgba(0,200,210,0.35); font-size: 11px; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
      @keyframes textIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

      /* Bottom progress */
      .splash-bottom {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 5;
        animation: textIn 0.8s ease 0.6s both;
      }
      .splash-progress { width: 180px; height: 2px; background: rgba(0,210,220,0.08); border-radius: 1px; overflow: hidden; }
      .splash-progress-bar { height: 100%; width: 0; border-radius: 1px; background: linear-gradient(90deg, #006a72, #00dce6, #70d0d5); transition: width 0.3s ease; }
      .splash-status-text { color: rgba(0,200,210,0.3); font-size: 9px; letter-spacing: 2px; font-family: 'Orbitron', sans-serif; transition: opacity 0.2s; }

      /* ===== VOICE INTERFACE STATES ===== */
      /* Mic indicator */
      .jarvis-mic {
        position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
        z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 6px;
        cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .jarvis-mic-btn {
        width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(0,210,220,0.2);
        background: rgba(0,15,25,0.7); backdrop-filter: blur(8px);
        display: flex; align-items: center; justify-content: center;
        transition: all 0.4s ease; cursor: pointer;
      }
      .jarvis-mic-btn svg { width: 18px; height: 18px; fill: rgba(0,210,220,0.4); transition: fill 0.3s; }
      .jarvis-mic-label {
        font-family: 'Orbitron', sans-serif; font-size: 7px; letter-spacing: 2px;
        color: rgba(0,210,220,0.25); text-transform: uppercase; transition: color 0.3s;
      }

      /* Listening state */
      #jarvis-splash.listening .jarvis-mic-btn { border-color: rgba(0,240,250,0.7); box-shadow: 0 0 20px rgba(0,210,220,0.3), 0 0 40px rgba(0,210,220,0.1); }
      #jarvis-splash.listening .jarvis-mic-btn svg { fill: #00e5ef; }
      #jarvis-splash.listening .jarvis-mic-label { color: rgba(0,240,250,0.7); }
      #jarvis-splash.listening .hud-core-glow { animation: coreGlowActive 1s ease-in-out infinite; }
      #jarvis-splash.listening .hud-jarvis { animation: textGlowActive 1s ease-in-out infinite; }
      @keyframes coreGlowActive {
        0%,100% { opacity: 0.8; transform: translate(-50%,-50%) scale(1.2); }
        50% { opacity: 1; transform: translate(-50%,-50%) scale(1.8); }
      }
      @keyframes textGlowActive {
        0%,100% { text-shadow: 0 0 30px rgba(0,210,220,0.8), 0 0 60px rgba(0,210,220,0.4); }
        50% { text-shadow: 0 0 50px rgba(0,210,220,1), 0 0 100px rgba(0,210,220,0.6); }
      }

      /* Speaking state */
      #jarvis-splash.speaking .hud-core-glow { animation: corePulseSpeak 0.6s ease-in-out infinite; }
      #jarvis-splash.speaking .jarvis-mic-btn { border-color: rgba(253,203,110,0.5); box-shadow: 0 0 20px rgba(253,203,110,0.15); }
      #jarvis-splash.speaking .jarvis-mic-btn svg { fill: #fdcb6e; }
      #jarvis-splash.speaking .jarvis-mic-label { color: rgba(253,203,110,0.6); }
      @keyframes corePulseSpeak {
        0%,100% { opacity: 0.7; transform: translate(-50%,-50%) scale(1); }
        50% { opacity: 1; transform: translate(-50%,-50%) scale(1.6); }
      }

      /* Thinking state */
      #jarvis-splash.thinking .hud-core-glow { animation: coreGlowActive 0.5s ease-in-out infinite; }

      /* Transcript area */
      .jarvis-transcript {
        position: absolute; bottom: 115px; left: 50%; transform: translateX(-50%);
        max-width: 340px; width: 90%; text-align: center; z-index: 10;
        pointer-events: none;
      }
      .jarvis-user-text {
        color: rgba(0,225,235,0.8); font-size: 13px; font-weight: 400;
        min-height: 20px; transition: opacity 0.3s;
        text-shadow: 0 0 10px rgba(0,210,220,0.3);
      }
      .jarvis-response-text {
        color: rgba(200,230,235,0.7); font-size: 12px; font-weight: 300;
        margin-top: 8px; line-height: 1.5; min-height: 0;
        transition: opacity 0.4s;
      }
      .jarvis-user-text:empty, .jarvis-response-text:empty { display: none; }

      /* Waveform visualizer */
      .jarvis-wave {
        display: flex; align-items: center; justify-content: center; gap: 2px;
        height: 20px; margin-top: 4px; opacity: 0; transition: opacity 0.3s;
      }
      #jarvis-splash.listening .jarvis-wave, #jarvis-splash.speaking .jarvis-wave { opacity: 1; }
      .jarvis-wave-bar {
        width: 2px; height: 4px; background: rgba(0,210,220,0.5); border-radius: 1px;
        animation: waveBar 0.8s ease-in-out infinite alternate;
      }
      .jarvis-wave-bar:nth-child(2) { animation-delay: 0.1s; }
      .jarvis-wave-bar:nth-child(3) { animation-delay: 0.2s; }
      .jarvis-wave-bar:nth-child(4) { animation-delay: 0.3s; }
      .jarvis-wave-bar:nth-child(5) { animation-delay: 0.4s; }
      .jarvis-wave-bar:nth-child(6) { animation-delay: 0.3s; }
      .jarvis-wave-bar:nth-child(7) { animation-delay: 0.2s; }
      @keyframes waveBar {
        0% { height: 4px; }
        100% { height: 18px; background: rgba(0,230,240,0.8); }
      }
      #jarvis-splash.speaking .jarvis-wave-bar { background: rgba(253,203,110,0.4); }
      #jarvis-splash.speaking .jarvis-wave-bar { animation-name: waveBarSpeak; }
      @keyframes waveBarSpeak {
        0% { height: 4px; }
        100% { height: 14px; background: rgba(253,203,110,0.7); }
      }

      /* Center tap area */
      .hud-center { cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .hud-center-hint {
        font-family: 'Orbitron', sans-serif; font-size: 7px; letter-spacing: 2px;
        color: rgba(0,210,220,0.2); margin-top: 10px; transition: opacity 0.3s;
      }
      #jarvis-splash.listening .hud-center-hint, #jarvis-splash.speaking .hud-center-hint { opacity: 0; }

      /* Enter app button */
      .jarvis-enter-app {
        position: absolute; top: 20px; right: 20px; z-index: 10;
        font-family: 'Orbitron', sans-serif; font-size: 8px; letter-spacing: 1.5px;
        color: rgba(0,210,220,0.3); background: rgba(0,15,25,0.6);
        border: 1px solid rgba(0,210,220,0.1); border-radius: 4px;
        padding: 6px 12px; cursor: pointer; backdrop-filter: blur(4px);
        transition: all 0.3s; text-transform: uppercase;
      }
      .jarvis-enter-app:hover { color: rgba(0,230,240,0.7); border-color: rgba(0,210,220,0.3); }
    </style>
  </head>
  <body>
    <div id="jarvis-splash" aria-label="Loading Jarvis">
      <div class="hud-grid"></div>

      <!-- Particles -->
      <div class="splash-particle" style="width:2px;height:2px;left:8%;bottom:-5px;animation-duration:7s;animation-delay:0s;"></div>
      <div class="splash-particle" style="width:3px;height:3px;left:20%;bottom:-5px;animation-duration:9s;animation-delay:0.8s;"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:38%;bottom:-5px;animation-duration:6s;animation-delay:1.5s;"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:58%;bottom:-5px;animation-duration:8s;animation-delay:0.3s;"></div>
      <div class="splash-particle" style="width:3px;height:3px;left:72%;bottom:-5px;animation-duration:7.5s;animation-delay:2s;"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:88%;bottom:-5px;animation-duration:6.5s;animation-delay:1s;"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:48%;bottom:-5px;animation-duration:8.5s;animation-delay:2.5s;"></div>
      <div class="splash-particle" style="width:3px;height:3px;left:15%;bottom:-5px;animation-duration:10s;animation-delay:3s;"></div>

      <!-- Full-screen HUD Reactor -->
      <div class="hud-reactor">
        <!-- Sonar rings -->
        <div class="hud-sonar"></div><div class="hud-sonar"></div><div class="hud-sonar"></div><div class="hud-sonar"></div>

        <!-- Core glow -->
        <div class="hud-core-glow"></div>

        <!-- The SVG — all rings built with JS for proper rotation -->
        <svg id="hud-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>

        <!-- Center overlay -->
        <div class="hud-center" id="hud-center-tap">
          <div class="hud-jarvis">J.A.R.V.I.S</div>
          <div class="hud-clock" id="hud-clock"></div>
          <div class="hud-center-hint">TAP TO TALK</div>
        </div>
      </div>

      <!-- Top greeting -->
      <div class="splash-top">
        <div class="splash-greeting" id="splash-greeting"></div>
        <div class="splash-date" id="splash-date"></div>
      </div>

      <!-- Live data feed -->
      <div class="splash-feed" id="splash-feed"></div>

      <!-- Transcript area -->
      <div class="jarvis-transcript">
        <div class="jarvis-user-text" id="jarvis-user-text"></div>
        <div class="jarvis-wave" id="jarvis-wave">
          <div class="jarvis-wave-bar"></div><div class="jarvis-wave-bar"></div><div class="jarvis-wave-bar"></div>
          <div class="jarvis-wave-bar"></div><div class="jarvis-wave-bar"></div><div class="jarvis-wave-bar"></div>
          <div class="jarvis-wave-bar"></div>
        </div>
        <div class="jarvis-response-text" id="jarvis-response-text"></div>
      </div>

      <!-- Mic button -->
      <div class="jarvis-mic" id="jarvis-mic">
        <div class="jarvis-mic-btn">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </div>
        <div class="jarvis-mic-label" id="jarvis-mic-label">SAY "JARVIS"</div>
      </div>

      <!-- Enter app button -->
      <button class="jarvis-enter-app" id="jarvis-enter-app">OPEN APP →</button>

      <!-- Bottom progress -->
      <div class="splash-bottom">
        <div class="splash-progress"><div class="splash-progress-bar" id="splash-progress"></div></div>
        <div class="splash-status-text" id="splash-status">INITIALIZING</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
    (function() {
      // === BUILD THE HUD SVG WITH JAVASCRIPT ===
      var svg = document.getElementById('hud-svg');
      var NS = 'http://www.w3.org/2000/svg';
      var CX = 250, CY = 250; // center of 500x500 viewBox

      // Helper: create SVG element
      function el(tag, attrs) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        return e;
      }

      // Defs: glow filters
      var defs = el('defs', {});
      // Soft glow
      var f1 = el('filter', { id: 'g1' });
      f1.appendChild(el('feGaussianBlur', { stdDeviation: '2', in: 'SourceGraphic', result: 'b' }));
      var m1 = el('feMerge', {});
      m1.appendChild(el('feMergeNode', { in: 'b' }));
      m1.appendChild(el('feMergeNode', { in: 'SourceGraphic' }));
      f1.appendChild(m1);
      defs.appendChild(f1);
      // Strong glow
      var f2 = el('filter', { id: 'g2' });
      f2.appendChild(el('feGaussianBlur', { stdDeviation: '4', in: 'SourceGraphic', result: 'b' }));
      var m2 = el('feMerge', {});
      m2.appendChild(el('feMergeNode', { in: 'b' }));
      m2.appendChild(el('feMergeNode', { in: 'SourceGraphic' }));
      f2.appendChild(m2);
      defs.appendChild(f2);
      svg.appendChild(defs);

      // Ring definitions: [radius, elements[], speed (deg/s), filter]
      var rings = [];

      // --- RING 8: Outermost hairline dashed ---
      var r8 = el('g', {});
      r8.appendChild(el('circle', { cx: CX, cy: CY, r: 245, fill: 'none', stroke: 'rgba(0,210,220,0.06)', 'stroke-width': '0.5', 'stroke-dasharray': '2 6' }));
      rings.push({ g: r8, speed: 0.5 });

      // --- RING 7: Major tick marks (every 10°) + minor ticks (every 2°) ---
      var r7 = el('g', {});
      for (var a = 0; a < 360; a += 2) {
        var major = a % 10 === 0;
        var cardinal = a % 90 === 0;
        r7.appendChild(el('line', {
          x1: CX, y1: CY - 235, x2: CX, y2: CY - (cardinal ? 220 : major ? 225 : 230),
          stroke: cardinal ? 'rgba(0,230,240,0.5)' : major ? 'rgba(0,210,220,0.25)' : 'rgba(0,210,220,0.08)',
          'stroke-width': cardinal ? '1.5' : major ? '1' : '0.4',
          transform: 'rotate(' + a + ' ' + CX + ' ' + CY + ')'
        }));
      }
      // Cardinal labels
      var labels = [['N', 0], ['E', 90], ['S', 180], ['W', 270]];
      labels.forEach(function(l) {
        var rad = (l[1] - 90) * Math.PI / 180;
        var lx = CX + 210 * Math.cos(rad);
        var ly = CY + 210 * Math.sin(rad);
        r7.appendChild(el('text', {
          x: lx, y: ly + 4, fill: 'rgba(0,210,220,0.3)', 'font-size': '8',
          'font-family': 'Orbitron, sans-serif', 'text-anchor': 'middle'
        }));
        r7.lastChild.textContent = l[0];
      });
      rings.push({ g: r7, speed: -1.2, filter: 'url(#g1)' });

      // --- RING 6: Thick segmented arc ---
      var r6 = el('g', {});
      r6.appendChild(el('circle', { cx: CX, cy: CY, r: 205, fill: 'none', stroke: 'rgba(0,210,220,0.18)', 'stroke-width': '4', 'stroke-dasharray': '50 12 25 12 70 12 35 12 45 12', 'stroke-linecap': 'round' }));
      // Bright highlight arc
      r6.appendChild(el('circle', { cx: CX, cy: CY, r: 205, fill: 'none', stroke: 'rgba(0,240,250,0.55)', 'stroke-width': '4', 'stroke-dasharray': '60 1000', 'stroke-linecap': 'round', filter: 'url(#g2)' }));
      rings.push({ g: r6, speed: 2.0 });

      // --- RING 5: Double thin rings ---
      var r5 = el('g', {});
      r5.appendChild(el('circle', { cx: CX, cy: CY, r: 190, fill: 'none', stroke: 'rgba(0,210,220,0.1)', 'stroke-width': '1' }));
      r5.appendChild(el('circle', { cx: CX, cy: CY, r: 186, fill: 'none', stroke: 'rgba(0,210,220,0.06)', 'stroke-width': '0.5', 'stroke-dasharray': '4 3' }));
      // Bright accent arc
      r5.appendChild(el('circle', { cx: CX, cy: CY, r: 190, fill: 'none', stroke: 'rgba(0,235,245,0.6)', 'stroke-width': '2.5', 'stroke-dasharray': '90 700', 'stroke-linecap': 'round', filter: 'url(#g2)' }));
      // Gold accent arc

      // --- RING 0: Inner glow ring (static) ---
      svg.appendChild(el('circle', { cx: CX, cy: CY, r: 88, fill: 'none', stroke: 'rgba(0,210,220,0.2)', 'stroke-width': '1.5', filter: 'url(#g1)' }));
      svg.appendChild(el('circle', { cx: CX, cy: CY, r: 84, fill: 'none', stroke: 'rgba(0,210,220,0.06)', 'stroke-width': '0.5' }));

      // Append all ring groups
      rings.forEach(function(ring) {

      // === JAVASCRIPT-DRIVEN ROTATION WITH VOICE-MODULATED SPEED ===
      var angles = rings.map(function() { return 0; });
      var lastTime = performance.now();
      var speedMultiplier = 1;

      function updateSpeedMultiplier() {

      function animate(now) {
        var dt = (now - lastTime) / 1000;
        lastTime = now;
        updateSpeedMultiplier();
        for (var i = 0; i < rings.length; i++) {
          angles[i] = (angles[i] + rings[i].speed * dt * speedMultiplier) % 360;
          rings[i].g.setAttribute('transform', 'rotate(' + angles[i] + ' ' + CX + ' ' + CY + ')');
        }
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      // === REAL TIME ===
      var now = new Date();
      var h = now.getHours();
      var greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      try { var u = JSON.parse(localStorage.getItem('jarvis_user')); if (u && u.name) greet += ', ' + u.name; } catch(e) {}

      var gEl = document.getElementById('splash-greeting');
      var clockEl = document.getElementById('hud-clock');
      var dEl = document.getElementById('splash-date');
      if (gEl) gEl.textContent = greet;
      if (clockEl) clockEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      if (dEl) dEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      setInterval(function() {
        if (clockEl) clockEl.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }, 1000);

      // === LIVE DATA FEED ===
      var feed = document.getElementById('splash-feed');
      var progress = document.getElementById('splash-progress');
      var statusEl = document.getElementById('splash-status');
      var step = 0, totalSteps = 6;

      function setProgress(pct, label) {
        if (progress) progress.style.width = pct + '%';
        if (statusEl) { statusEl.style.opacity = '0'; setTimeout(function() { statusEl.textContent = label; statusEl.style.opacity = '1'; }, 150); }
      }

      function addFeedItem(icon, label, value) {
        if (!feed) return;
        var div = document.createElement('div');
        div.className = 'splash-feed-item';
        div.innerHTML = '<span class="splash-feed-icon">' + icon + '</span><div><div class="splash-feed-label">' + label + '</div><div class="splash-feed-value">' + value + '</div></div>';
        feed.appendChild(div);
        var items = feed.querySelectorAll('.splash-feed-item');
        if (items.length > 5) items[0].remove();
        setTimeout(function() { div.classList.add('show'); }, 30);
        step++;
        setProgress(Math.min(95, Math.round((step / totalSteps) * 100)), step >= totalSteps ? 'SYSTEMS ONLINE' : 'SCANNING');
      }

      setTimeout(function() {
        setProgress(10, 'SCANNING WORLD CLOCKS');
        var zones = [['NY','America/New_York'],['LON','Europe/London'],['TYO','Asia/Tokyo'],['LA','America/Los_Angeles']];
        var parts = zones.map(function(z) {
          try { return z[0] + ' <span class="accent">' + new Date().toLocaleTimeString('en-US',{timeZone:z[1],hour:'numeric',minute:'2-digit',hour12:true}) + '</span>'; } catch(e) { return ''; }
        }).filter(Boolean);
        addFeedItem('🌍', 'WORLD CLOCKS', parts.join(' · '));
      }, 400);

      setTimeout(function() {
        setProgress(25, 'READING SCHEDULE');
        try {
          var events = JSON.parse(localStorage.getItem('jarvis_events') || '[]');
          var tasks = JSON.parse(localStorage.getItem('jarvis_tasks') || '[]');
          var todayStr = new Date().toISOString().split('T')[0];
          var te = events.filter(function(e){return e.date===todayStr;});
          var pt = tasks.filter(function(t){return !t.completed;});
          var msg = '<span class="accent">' + te.length + '</span> events · <span class="warn">' + pt.length + '</span> tasks';
          if (te.length > 0) msg += ' · ' + te.slice(0,2).map(function(e){return e.title;}).join(', ');
          addFeedItem('📋', 'TODAY', msg);
        } catch(e) { addFeedItem('📋', 'TODAY', 'No data'); }
      }, 900);

      setTimeout(function() {
        setProgress(40, 'QUERYING LIVE TRAIN DATA');
        // Work schedule:
        //   #6 EB: departs EMY ~2 days before, arrives LNK Mon/Wed/Fri. Board LNK, work to OTM.
        //   #5 WB: departs CHI Mon/Wed/Fri, arrives OTM same day. Board OTM, work to LNK (~0030 next day).
        var mySchedule = {
          '6': { board: 'LNK', dest: 'OTM', dir: 'EB', workDays: [1,3,5], label: 'LNK→OTM' },
          '5': { board: 'OTM', dest: 'LNK', dir: 'WB', workDays: [1,3,5], label: 'OTM→LNK' }
        };
        var daysOfWeek = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        var trainNums = ['5', '6'];
        var apiBase = 'https://api-v3.amtraker.com/v3/trains/';
        var promises = trainNums.map(function(n) {
          return fetch(apiBase + n).then(function(r) { return r.json(); }).then(function(data) {
            return { train: n, data: data };
          }).catch(function() { return { train: n, data: null }; });
        });
        Promise.all(promises).then(function(results) {
          var msgs = [];
          results.forEach(function(res) {
            if (!res.data) return;
            var instances = res.data[res.train] || Object.values(res.data)[0];
            if (!instances || !Array.isArray(instances) || instances.length === 0) return;
            var sched = mySchedule[res.train];
            instances.forEach(function(inst) {
              var stations = inst.stations || [];
              if (!Array.isArray(stations)) stations = Object.values(stations);
              // Show arrival at boarding station
              var boardSt = stations.find(function(s) { return s.code === sched.board; });
              var status = '';
              var timeStr = '';
              var isWorkTrain = false;
              if (boardSt) {
                // Check if the train arrives at boarding station on a work day (M/W/F)
                var arrDate = boardSt.schArr ? new Date(boardSt.schArr) : null;
                if (arrDate) {
                  isWorkTrain = sched.workDays.indexOf(arrDate.getDay()) >= 0;
                }
                if (boardSt.arr && boardSt.schArr) {
                  var delay = Math.round((new Date(boardSt.arr).getTime() - new Date(boardSt.schArr).getTime()) / 60000);
                  var arrTime = new Date(boardSt.arr).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                  if (delay <= 0) { status = '<span class="hi">On time</span>'; }
                  else if (delay < 60) { status = '<span class="warn">' + delay + 'm late</span>'; }
                  else { status = '<span class="warn">' + Math.floor(delay/60) + 'h ' + (delay%60) + 'm late</span>'; }
                  timeStr = ' · Arr ' + arrTime;
                } else if (boardSt.schArr) {
                  var schTime = new Date(boardSt.schArr).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                  timeStr = ' · Sched ' + schTime;
                  status = boardSt.status || '';
                } else {
                  status = boardSt.status || '';
                }
              }
              var current = stations.find(function(s) { return s.status === 'Enroute'; }) || stations.find(function(s) { return s.status === 'Station'; });
              var currentStr = current ? ' · Now: ' + (current.name || current.code) : '';
              var prefix = isWorkTrain ? '⭐ ' : '';
              var workTag = isWorkTrain ? ' <span style="color:#fdcb6e;font-size:9px;background:rgba(253,203,110,0.15);padding:1px 5px;border-radius:4px;margin-left:4px">YOUR TRAIN · ' + sched.label + '</span>' : '';
              msgs.push(prefix + '<span class="hi">#' + res.train + '</span> ' + sched.dir + ' → ' + sched.board + timeStr + ' ' + status + currentStr + workTag);
            });
          });
          if (msgs.length > 0) {
            addFeedItem('🚂', 'LIVE TRAINS', msgs.join('<br>'));
          } else {
            var today = new Date().getDay();
            var nextWorkDay = '';
            for (var i = 1; i <= 7; i++) {
              var d = (today + i) % 7;
              if ([1,3,5].indexOf(d) >= 0) { nextWorkDay = daysOfWeek[d]; break; }
            }
            addFeedItem('🚂', 'TRAINS', 'No active trains right now<br>⭐ Next work trains on ' + nextWorkDay);
          }
        }).catch(function() {
          addFeedItem('🚂', 'TRAINS', 'API offline — check app');
        });
      }, 1400);

      setTimeout(function() {
        setProgress(55, 'FETCHING WEATHER');
        fetch('https://wttr.in/?format=j1').then(function(r){return r.json();}).then(function(d) {
          var c = d.current_condition && d.current_condition[0];
          if (c) {
            var area = d.nearest_area && d.nearest_area[0];
            var city = area ? (area.areaName && area.areaName[0] && area.areaName[0].value) || '' : '';
            addFeedItem('🌡', 'WEATHER' + (city ? ' · ' + city.toUpperCase() : ''),
              '<span class="hi">' + c.temp_F + '°F</span> · ' + (c.weatherDesc&&c.weatherDesc[0]&&c.weatherDesc[0].value||'') +
              ' · Feels ' + c.FeelsLikeF + '°F · 💨' + c.windspeedMiles + 'mph');
          } else { addFeedItem('🌡', 'WEATHER', 'Unavailable'); }
        }).catch(function() { addFeedItem('🌡', 'WEATHER', 'Offline'); });
      }, 1900);

      setTimeout(function() {
        setProgress(75, 'PULLING HEADLINES');
        fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fnews.google.com%2Frss%3Fhl%3Den-US%26gl%3DUS%26ceid%3DUS%3Aen')
          .then(function(r){return r.json();}).then(function(d) {
            if (d.items && d.items.length > 0) {
              addFeedItem('📰', 'HEADLINES', d.items.slice(0,3).map(function(i){return '• '+i.title.replace(/ - [^-]+$/,'');}).join('<br>'));
            } else { addFeedItem('📰', 'NEWS', 'No headlines'); }
          }).catch(function() { addFeedItem('📰', 'NEWS', 'Offline'); });
      }, 2500);

      setTimeout(function() {
        setProgress(90, 'CHECKING REMINDERS');
        try {
          var rem = JSON.parse(localStorage.getItem('jarvis_reminders') || '[]');
          var active = rem.filter(function(r){return !r.dismissed;});
          if (active.length > 0) {
            addFeedItem('⏰', 'REMINDERS', '<span class="warn">' + active.length + '</span> active · ' + (active[0].text||active[0].title||''));
          } else { addFeedItem('⏰', 'REMINDERS', 'All clear'); }
        } catch(e) { addFeedItem('⏰', 'REMINDERS', 'Clear'); }
      }, 3100);

      // === JARVIS STAYS ON SCREEN AS AMBIENT DISPLAY ===
      var reactReady = false;
      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          if (mutations[i].addedNodes.length > 0) {
            reactReady = true;
            setProgress(100, 'ALL SYSTEMS ONLINE');
            observer.disconnect();
            break;
          }
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });

      // "Open App" button — dismiss splash to show React app underneath
      document.getElementById('jarvis-enter-app').addEventListener('click', function() {
        var splash = document.getElementById('jarvis-splash');
        if (splash) {
          splash.classList.add('hide');
          setTimeout(function() { splash.style.display = 'none'; }, 1200);
        }
      });

      // === VOICE ENGINE ===
      var splash = document.getElementById('jarvis-splash');
      var userTextEl = document.getElementById('jarvis-user-text');
      var responseTextEl = document.getElementById('jarvis-response-text');
      var micLabel = document.getElementById('jarvis-mic-label');
      var voiceState = 'idle'; // idle, listening, thinking, speaking
      var recognition = null;
      var isListeningForCommand = false;
      var restartTimeout = null;

      function setVoiceState(state) {
        voiceState = state;
        splash.classList.remove('listening', 'thinking', 'speaking');
        if (state !== 'idle') splash.classList.add(state);

        switch (state) {
          case 'idle':
            targetSpeedMultiplier = 1;
            micLabel.textContent = 'SAY "JARVIS"';
            break;
          case 'listening':
            targetSpeedMultiplier = 2.5;
            micLabel.textContent = 'LISTENING...';
            break;
          case 'thinking':
            targetSpeedMultiplier = 4;
            micLabel.textContent = 'PROCESSING...';
            break;
          case 'speaking':
            targetSpeedMultiplier = 1.8;
            micLabel.textContent = 'SPEAKING...';
            break;
        }
      }

      // === SPEECH SYNTHESIS ===
      function jarvisSay(text, callback) {
        if (!('speechSynthesis' in window)) {
          if (responseTextEl) responseTextEl.textContent = text;
          setVoiceState('idle');
          if (callback) setTimeout(callback, 2000);
          return;
        }
        setVoiceState('speaking');
        if (responseTextEl) responseTextEl.textContent = text;
        var utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        utter.pitch = 0.9;
        utter.volume = 1;
        // Try to find a British or smooth male voice
        var voices = speechSynthesis.getVoices();
        var preferred = voices.find(function(v) { return /daniel/i.test(v.name); })
          || voices.find(function(v) { return /british/i.test(v.name) && /male/i.test(v.name); })
          || voices.find(function(v) { return /en-GB/i.test(v.lang) && !/female/i.test(v.name); })
          || voices.find(function(v) { return /en.US/i.test(v.lang) && /male/i.test(v.name); })
          || voices.find(function(v) { return /en/i.test(v.lang); });
        if (preferred) utter.voice = preferred;

        utter.onend = function() {
          setVoiceState('idle');
          // Clear text after a few seconds
          setTimeout(function() {
            if (voiceState === 'idle') {
              if (userTextEl) userTextEl.textContent = '';
              if (responseTextEl) responseTextEl.textContent = '';
            }
          }, 5000);
          if (callback) callback();
        };
        utter.onerror = function() {
          setVoiceState('idle');
          if (callback) callback();
        };
        speechSynthesis.cancel();
        speechSynthesis.speak(utter);
      }

      // Preload voices (some browsers need this)
      if ('speechSynthesis' in window) {
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = function() { speechSynthesis.getVoices(); };
      }

      // === COMMAND PROCESSOR ===
      function processCommand(text) {
        var t = text.toLowerCase().trim();
        setVoiceState('thinking');

        // Time
        if (/what time|current time|time is it/.test(t)) {
          var now = new Date();
          jarvisSay('It is currently ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + '.');
          return;
        }

        // Date
        if (/what day|today's date|what date|what is the date/.test(t)) {
          var now = new Date();
          jarvisSay('Today is ' + now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) + '.');
          return;
        }

        // Weather
        if (/weather|temperature|how hot|how cold|forecast/.test(t)) {
          jarvisSay('Let me check the weather.');
          fetch('https://wttr.in/?format=j1').then(function(r){return r.json();}).then(function(d) {
            var c = d.current_condition && d.current_condition[0];
            if (c) {
              var area = d.nearest_area && d.nearest_area[0];
              var city = area ? (area.areaName && area.areaName[0] && area.areaName[0].value) || 'your area' : 'your area';
              jarvisSay('Currently ' + c.temp_F + ' degrees in ' + city + '. ' + (c.weatherDesc&&c.weatherDesc[0]&&c.weatherDesc[0].value||'') + '. Feels like ' + c.FeelsLikeF + ' degrees with winds at ' + c.windspeedMiles + ' miles per hour.');
            } else { jarvisSay('I was unable to retrieve weather data at the moment.'); }
          }).catch(function() { jarvisSay('Weather service is currently offline, sir.'); });
          return;
        }

        // Trains
        if (/train|amtrak|number 5|number 6|#5|#6|zephyr/.test(t)) {
          jarvisSay('Checking live train status.');
          var apiBase = 'https://api-v3.amtraker.com/v3/trains/';
          Promise.all(['5','6'].map(function(n) {
            return fetch(apiBase + n).then(function(r){return r.json();}).then(function(data){return {train:n,data:data};}).catch(function(){return {train:n,data:null};});
          })).then(function(results) {
            var parts = [];
            var mySchedule = {
              '6': { board: 'LNK', dest: 'OTM' },
              '5': { board: 'OTM', dest: 'LNK' }
            };
            results.forEach(function(res) {
              if (!res.data) return;
              var instances = res.data[res.train] || Object.values(res.data)[0];
              if (!instances || !Array.isArray(instances) || instances.length === 0) return;
              var sched = mySchedule[res.train];
              instances.forEach(function(inst) {
                var stations = inst.stations || [];
                if (!Array.isArray(stations)) stations = Object.values(stations);
                var boardSt = stations.find(function(s) { return s.code === sched.board; });
                var current = stations.find(function(s) { return s.status === 'Enroute'; }) || stations.find(function(s) { return s.status === 'Station'; });
                var dir = res.train === '6' ? 'eastbound' : 'westbound';
                var info = 'Train ' + res.train + ' ' + dir;
                if (boardSt && boardSt.arr && boardSt.schArr) {
                  var delay = Math.round((new Date(boardSt.arr).getTime() - new Date(boardSt.schArr).getTime()) / 60000);
                  var arrTime = new Date(boardSt.arr).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                  info += ', arriving ' + sched.board + ' at ' + arrTime;
                  if (delay > 0) info += ', running ' + delay + ' minutes late';
                  else info += ', on time';
                } else if (boardSt && boardSt.schArr) {
                  var schTime = new Date(boardSt.schArr).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                  info += ', scheduled at ' + sched.board + ' for ' + schTime;
                }
                if (current) info += '. Currently near ' + (current.name || current.code);
                parts.push(info);
              });
            });
            if (parts.length > 0) {
              jarvisSay(parts.join('. ') + '.');
            } else {
              jarvisSay('No active California Zephyr trains at the moment. Your next work trains run on Monday, Wednesday, and Friday.');
            }
          }).catch(function() { jarvisSay('The train tracking service appears to be offline.'); });
          return;
        }

        // Schedule / events
        if (/schedule|events?|calendar|what do i have|plans/.test(t)) {
          try {
            var events = JSON.parse(localStorage.getItem('jarvis_events') || '[]');
            var today = new Date().toDateString();
            var todayEvents = events.filter(function(e) { return new Date(e.date || e.start).toDateString() === today; });
            if (todayEvents.length > 0) {
              jarvisSay('You have ' + todayEvents.length + ' event' + (todayEvents.length > 1 ? 's' : '') + ' today. ' + todayEvents.map(function(e) { return e.title || e.name; }).join(', ') + '.');
            } else {
              jarvisSay('Your calendar is clear for today.');
            }
          } catch(e) { jarvisSay('Your calendar is clear for today.'); }
          return;
        }

        // Tasks / reminders
        if (/task|reminder|to.?do|pending/.test(t)) {
          try {
            var tasks = JSON.parse(localStorage.getItem('jarvis_tasks') || '[]');
            var pending = tasks.filter(function(t) { return !t.done && !t.completed; });
            var rem = JSON.parse(localStorage.getItem('jarvis_reminders') || '[]');
            var activeRem = rem.filter(function(r) { return !r.dismissed; });
            var parts = [];
            if (pending.length > 0) parts.push(pending.length + ' pending task' + (pending.length > 1 ? 's' : ''));
            if (activeRem.length > 0) parts.push(activeRem.length + ' active reminder' + (activeRem.length > 1 ? 's' : ''));
            if (parts.length > 0) {
              jarvisSay('You have ' + parts.join(' and ') + '.');
            } else {
              jarvisSay('No pending tasks or reminders. You are all clear.');
            }
          } catch(e) { jarvisSay('No pending tasks or reminders.'); }
          return;
        }

        // Greetings
        if (/^(hello|hey|hi|good morning|good evening|good afternoon|sup|yo|what'?s up)/i.test(t)) {
          var h = new Date().getHours();
          var greetTime = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
          var userName = '';
          try { var u = JSON.parse(localStorage.getItem('jarvis_user')); if (u && u.name) userName = ', ' + u.name; } catch(e) {}
          jarvisSay('Good ' + greetTime + userName + '. All systems are running nominally. How can I help you?');
          return;
        }

        // Who are you
        if (/who are you|what are you|your name/.test(t)) {
          jarvisSay("I am JARVIS, your Just A Rather Very Intelligent System. I manage your trains, calendar, weather, and other vital systems.");
          return;
        }

        // Goodnight / goodbye
        if (/good\s?night|good\s?bye|see you|signing off|go to sleep/.test(t)) {
          jarvisSay('Goodnight, sir. I will keep monitoring all systems. Rest well.');
          return;
        }

        // Status
        if (/status|systems?|how are you|report|sitrep/.test(t)) {
          var parts = ['All systems nominal.'];
          try {
            var tasks = JSON.parse(localStorage.getItem('jarvis_tasks') || '[]');
            var pending = tasks.filter(function(t){return !t.done && !t.completed;});
            if (pending.length > 0) parts.push(pending.length + ' pending tasks.');
          } catch(e) {}
          var daysOfWeek = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
          var dow = new Date().getDay();
          if ([1,3,5].indexOf(dow) >= 0) {
            parts.push('Today is a work train day.');
          } else {
            var next = '';
            for (var i = 1; i <= 7; i++) { if ([1,3,5].indexOf((dow+i)%7)>=0) { next = daysOfWeek[(dow+i)%7]; break; } }
            parts.push('Next work train is ' + next + '.');
          }
          jarvisSay(parts.join(' '));
          return;
        }

        // Help
        if (/help|what can you do|commands/.test(t)) {
          jarvisSay('I can tell you the time, date, weather, train status, your schedule, tasks, and system status. Just ask naturally, or say Jarvis followed by your question.');
          return;
        }

        // Fallback
        jarvisSay("I'm not sure how to help with that. Try asking about the time, weather, trains, your schedule, or system status.");
      }

      // === SPEECH RECOGNITION ===
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      var finalTranscript = '';
      var silenceTimer = null;

      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        recognition.maxAlternatives = 1;

        recognition.onresult = function(event) {
          var interim = '';
          for (var i = event.resultIndex; i < event.results.length; i++) {
            var transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalTranscript += transcript;
            } else {
              interim += transcript;
            }
          }

          // Show what user is saying
          if (userTextEl) userTextEl.textContent = finalTranscript || interim;

          if (isListeningForCommand) {
            // Reset silence timer — process after 1.5s of silence
            clearTimeout(silenceTimer);
            if (finalTranscript.trim()) {
              silenceTimer = setTimeout(function() {
                var cmd = finalTranscript.trim();
                finalTranscript = '';
                isListeningForCommand = false;
                try { recognition.stop(); } catch(e) {}
                processCommand(cmd);
              }, 1500);
            }
          } else {
            // Wake word detection
            var full = (finalTranscript + interim).toLowerCase();
            if (/jarvis/i.test(full)) {
              // Activate!
              finalTranscript = full.replace(/.*jarvis\s*/i, ''); // Keep anything after "jarvis"
              isListeningForCommand = true;
              setVoiceState('listening');
              if (userTextEl) userTextEl.textContent = finalTranscript;
              // If they already said something after "jarvis", start the silence timer
              if (finalTranscript.trim()) {
                silenceTimer = setTimeout(function() {
                  var cmd = finalTranscript.trim();
                  finalTranscript = '';
                  isListeningForCommand = false;
                  try { recognition.stop(); } catch(e) {}
                  processCommand(cmd);
                }, 1500);
              }
            }
          }
        };

        recognition.onerror = function(event) {
          if (event.error === 'not-allowed') {
            if (micLabel) micLabel.textContent = 'MIC BLOCKED';
          } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
            // Auto-restart on network errors etc.
            clearTimeout(restartTimeout);
            restartTimeout = setTimeout(startRecognition, 2000);
          }
        };

        recognition.onend = function() {
          // If we were listening for a command and it ended, process what we have
          if (isListeningForCommand && finalTranscript.trim()) {
            var cmd = finalTranscript.trim();
            finalTranscript = '';
            isListeningForCommand = false;
            processCommand(cmd);
          } else if (isListeningForCommand) {
            // They activated but said nothing
            isListeningForCommand = false;
            setVoiceState('idle');
            if (userTextEl) userTextEl.textContent = '';
          }
          // Auto-restart after a brief pause (continuous ambient listening)
          if (voiceState !== 'speaking') {
            clearTimeout(restartTimeout);
            restartTimeout = setTimeout(startRecognition, 500);
          }
        };

        function startRecognition() {
          try {
            finalTranscript = '';
            isListeningForCommand = false;
            if (voiceState !== 'speaking') setVoiceState('idle');
            recognition.start();
          } catch(e) {
            // Already running — that's fine
          }
        }

        // Start ambient listening — require a user gesture first so the
        // browser mic-permission prompt is tappable on mobile.
        var micStarted = false;
        function firstGestureStart() {
          if (micStarted) return;
          micStarted = true;
          document.removeEventListener('click', firstGestureStart, true);
          document.removeEventListener('touchend', firstGestureStart, true);
          // Small delay so the gesture event finishes before we request mic
          setTimeout(startRecognition, 300);
        }
        // Try auto-start after a longer delay (works on desktop where no gesture needed)
        setTimeout(function() {
          if (!micStarted) {
            micStarted = true;
            startRecognition();
          }
        }, 6000);
        // On mobile, wait for first tap anywhere on the page
        document.addEventListener('click', firstGestureStart, true);
        document.addEventListener('touchend', firstGestureStart, true);
      } else {
        // No speech recognition — show tap-only mode
        if (micLabel) micLabel.textContent = 'TAP TO TALK';
      }

      // === TAP TO TALK (center or mic button) ===
      function tapToTalk() {
        if (voiceState === 'speaking') {
          speechSynthesis.cancel();
          setVoiceState('idle');
          return;
        }
        if (voiceState === 'listening') {
          // Already listening — process what we have
          if (finalTranscript && finalTranscript.trim()) {
            var cmd = finalTranscript.trim();
            finalTranscript = '';
            isListeningForCommand = false;
            try { recognition.stop(); } catch(e) {}
            processCommand(cmd);
          }
          return;
        }
        // Activate listening mode
        isListeningForCommand = true;
        finalTranscript = '';
        setVoiceState('listening');
        if (userTextEl) userTextEl.textContent = '';
        if (responseTextEl) responseTextEl.textContent = '';
        if (recognition) {
          try { recognition.stop(); } catch(e) {}
          setTimeout(function() {
            try { recognition.start(); } catch(e) {}
          }, 200);
        }
      }

      document.getElementById('hud-center-tap').addEventListener('click', tapToTalk);
      document.getElementById('jarvis-mic').addEventListener('click', tapToTalk);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() { navigator.serviceWorker.register('./sw.js').catch(function(){}); });
      }
    })();
    </script>
  </body>
</html>
