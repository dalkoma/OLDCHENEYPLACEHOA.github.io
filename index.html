<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="Jarvis - Your personal AI life manager with calendar, tasks, train tracking, meals, and more." />
    <title>Jarvis - Your Personal AI Assistant</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0e18; overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      @media (hover: none) and (pointer: coarse) { button, a, [role="button"], input, select, textarea { min-height: 40px; } }
      @media (resolution >= 2dppx) { * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; } }
      @media (orientation: landscape) { #root { transition: none; } }

      /* ===== JARVIS HUD BOOT ===== */
      #jarvis-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(ellipse at center, #0d1525 0%, #060a12 60%, #020408 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        overflow: hidden;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #jarvis-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }

      /* === HUD ARC REACTOR === */
      .hud-reactor {
        position: relative;
        width: min(380px, 85vw); height: min(380px, 85vw);
        margin-bottom: 20px; flex-shrink: 0;
      }
      .hud-reactor svg {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        filter: drop-shadow(0 0 12px rgba(0, 200, 220, 0.3));
      }

      /* Spinning ring layers */
      .hud-ring-1 { animation: hudSpin 12s linear infinite; }
      .hud-ring-2 { animation: hudSpin 8s linear infinite reverse; }
      .hud-ring-3 { animation: hudSpin 15s linear infinite; }
      .hud-ring-4 { animation: hudSpin 6s linear infinite reverse; }
      .hud-ring-5 { animation: hudSpin 20s linear infinite; }
      .hud-ring-6 { animation: hudSpin 10s linear infinite reverse; }
      .hud-ring-7 { animation: hudSpin 4s linear infinite; }

      @keyframes hudSpin { from { transform-origin: 50% 50%; transform: rotate(0deg); } to { transform-origin: 50% 50%; transform: rotate(360deg); } }

      /* Core glow */
      .hud-core-glow {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 90px; height: 90px; border-radius: 50%;
        background: radial-gradient(circle, rgba(0,210,220,0.25) 0%, rgba(0,210,220,0.08) 40%, transparent 70%);
        filter: blur(8px);
        animation: coreGlow 2s ease-in-out infinite;
      }
      @keyframes coreGlow { 0%,100% { opacity: 0.7; transform: translate(-50%,-50%) scale(1); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); } }

      /* Center text */
      .hud-center {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; z-index: 3;
      }
      .hud-jarvis {
        font-size: 20px; font-weight: 600; letter-spacing: 8px;
        color: rgba(0, 220, 230, 0.9);
        text-shadow: 0 0 20px rgba(0,210,220,0.5), 0 0 40px rgba(0,210,220,0.2);
        animation: textGlow 2s ease-in-out infinite;
      }
      @keyframes textGlow { 0%,100% { text-shadow: 0 0 20px rgba(0,210,220,0.5), 0 0 40px rgba(0,210,220,0.2); } 50% { text-shadow: 0 0 30px rgba(0,210,220,0.8), 0 0 60px rgba(0,210,220,0.4); } }

      /* Outer expanding sonar rings */
      .hud-sonar {
        position: absolute; top: 50%; left: 50%; border-radius: 50%;
        border: 1px solid rgba(0,210,220,0.12);
        transform: translate(-50%, -50%) scale(0.5);
        animation: sonarExpand 4s ease-out infinite;
      }
      .hud-sonar:nth-child(1) { width: 420px; height: 420px; animation-delay: 0s; }
      .hud-sonar:nth-child(2) { width: 520px; height: 520px; animation-delay: 1s; }
      .hud-sonar:nth-child(3) { width: 640px; height: 640px; animation-delay: 2s; }
      .hud-sonar:nth-child(4) { width: 780px; height: 780px; animation-delay: 3s; }
      @keyframes sonarExpand {
        0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0; }
        15% { opacity: 0.4; }
        100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
      }

      /* Floating particles */
      .splash-particle { position: absolute; border-radius: 50%; background: rgba(0,210,220,0.25); animation: particleFloat linear infinite; }
      @keyframes particleFloat { 0% { transform: translateY(0) scale(1); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.5; } 100% { transform: translateY(-100vh) scale(0.3); opacity: 0; } }

      /* Grid background */
      .hud-grid {
        position: absolute; inset: 0; opacity: 0.04;
        background-image:
          linear-gradient(rgba(0,210,220,1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,210,220,1) 1px, transparent 1px);
        background-size: 60px 60px;
      }

      /* Text below reactor */
      .splash-greeting { color: #e0f4f4; font-size: 20px; font-weight: 600; margin-bottom: 2px; animation: textIn 0.8s ease 0.3s both; }
      .splash-clock { color: rgba(0,220,230,0.9); font-size: 38px; font-weight: 300; letter-spacing: 3px; font-variant-numeric: tabular-nums; animation: textIn 0.8s ease 0.5s both; text-shadow: 0 0 15px rgba(0,210,220,0.3); }
      .splash-date { color: #3a5060; font-size: 12px; margin-bottom: 20px; animation: textIn 0.8s ease 0.6s both; }
      @keyframes textIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

      /* Live data feed */
      .splash-feed { width: 90%; max-width: 420px; display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
      .splash-feed-item {
        display: flex; align-items: center; gap: 10px;
        padding: 7px 14px; border-radius: 8px;
        background: rgba(0,210,220,0.04); border: 1px solid rgba(0,210,220,0.12);
        opacity: 0; transform: translateX(-20px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .splash-feed-item.show { opacity: 1; transform: translateX(0); }
      .splash-feed-icon { font-size: 14px; flex-shrink: 0; width: 22px; text-align: center; }
      .splash-feed-label { color: rgba(0,210,220,0.5); font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
      .splash-feed-value { color: #c0dde0; font-size: 11px; line-height: 1.4; }
      .splash-feed-value .hi { color: #00dce6; }
      .splash-feed-value .warn { color: #fdcb6e; }
      .splash-feed-value .accent { color: #7dd8dc; }

      /* Bottom progress */
      .splash-bottom { position: absolute; bottom: 36px; display: flex; flex-direction: column; align-items: center; gap: 8px; animation: textIn 0.8s ease 0.8s both; }
      .splash-progress { width: 160px; height: 2px; background: rgba(0,210,220,0.1); border-radius: 1px; overflow: hidden; }
      .splash-progress-bar { height: 100%; width: 0; border-radius: 1px; background: linear-gradient(90deg, #00808a, #00dce6, #7dd8dc); transition: width 0.3s ease; }
      .splash-status-text { color: #2a4858; font-size: 10px; letter-spacing: 1.5px; transition: opacity 0.2s; }
    </style>
  </head>
  <body>
    <div id="jarvis-splash" aria-label="Loading Jarvis">
      <!-- Background grid -->
      <div class="hud-grid"></div>

      <!-- Particles -->
      <div class="splash-particle" style="width:2px;height:2px;left:8%;bottom:-5px;animation-duration:7s;animation-delay:0s;"></div>
      <div class="splash-particle" style="width:3px;height:3px;left:22%;bottom:-5px;animation-duration:9s;animation-delay:0.8s;"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:40%;bottom:-5px;animation-duration:6s;animation-delay:1.5s;"></div>
      <div class="splash-particle" style="width:3px;height:3px;left:60%;bottom:-5px;animation-duration:8s;animation-delay:0.3s;"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:75%;bottom:-5px;animation-duration:7.5s;animation-delay:2s;"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:88%;bottom:-5px;animation-duration:6.5s;animation-delay:1s;"></div>

      <!-- HUD Arc Reactor -->
      <div class="hud-reactor">
        <!-- Sonar rings -->
        <div class="hud-sonar"></div><div class="hud-sonar"></div><div class="hud-sonar"></div><div class="hud-sonar"></div>

        <!-- Core glow -->
        <div class="hud-core-glow"></div>

        <!-- SVG HUD Rings -->
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="glowStrong"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>

          <!-- RING 7: Outermost — thin dashed ring -->
          <g class="hud-ring-5">
            <circle cx="200" cy="200" r="190" fill="none" stroke="rgba(0,210,220,0.08)" stroke-width="0.5" stroke-dasharray="3 8"/>
          </g>

          <!-- RING 6: Outer tick marks (60 ticks) -->
          <g class="hud-ring-3" filter="url(#glow)">
            <g id="outer-ticks">
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1"/>
              <line x1="200" y1="18" x2="200" y2="24" stroke="rgba(0,210,220,0.15)" stroke-width="0.5" transform="rotate(6 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="24" stroke="rgba(0,210,220,0.15)" stroke-width="0.5" transform="rotate(12 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="24" stroke="rgba(0,210,220,0.15)" stroke-width="0.5" transform="rotate(18 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="24" stroke="rgba(0,210,220,0.15)" stroke-width="0.5" transform="rotate(24 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(30 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="24" stroke="rgba(0,210,220,0.15)" stroke-width="0.5" transform="rotate(36 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="24" stroke="rgba(0,210,220,0.15)" stroke-width="0.5" transform="rotate(42 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="24" stroke="rgba(0,210,220,0.15)" stroke-width="0.5" transform="rotate(48 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="24" stroke="rgba(0,210,220,0.15)" stroke-width="0.5" transform="rotate(54 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(60 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(90 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(120 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(150 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(180 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(210 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(240 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(270 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(300 200 200)"/>
              <line x1="200" y1="18" x2="200" y2="28" stroke="rgba(0,210,220,0.25)" stroke-width="1" transform="rotate(330 200 200)"/>
            </g>
          </g>

          <!-- RING 5: Segmented arc ring (thick, gaps) -->
          <g class="hud-ring-2" filter="url(#glow)">
            <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(0,210,220,0.2)" stroke-width="3" stroke-dasharray="40 15 20 15 60 15 30 15" stroke-linecap="round"/>
          </g>

          <!-- RING 4: Thin solid ring with bright arc highlight -->
          <g class="hud-ring-1">
            <circle cx="200" cy="200" r="155" fill="none" stroke="rgba(0,210,220,0.1)" stroke-width="1"/>
            <circle cx="200" cy="200" r="155" fill="none" stroke="rgba(0,230,240,0.6)" stroke-width="2.5" stroke-dasharray="80 500" stroke-linecap="round" filter="url(#glowStrong)"/>
            <circle cx="200" cy="200" r="155" fill="none" stroke="rgba(253,203,110,0.5)" stroke-width="2" stroke-dasharray="40 540" stroke-dashoffset="200" stroke-linecap="round" filter="url(#glow)"/>
          </g>

          <!-- RING 3: Inner segmented with notches -->
          <g class="hud-ring-4" filter="url(#glow)">
            <circle cx="200" cy="200" r="135" fill="none" stroke="rgba(0,210,220,0.15)" stroke-width="6" stroke-dasharray="8 4"/>
            <circle cx="200" cy="200" r="135" fill="none" stroke="rgba(0,230,240,0.45)" stroke-width="6" stroke-dasharray="25 200 15 200" stroke-linecap="round"/>
          </g>

          <!-- RING 2: Thin ring with dot markers -->
          <g class="hud-ring-6">
            <circle cx="200" cy="200" r="118" fill="none" stroke="rgba(0,210,220,0.12)" stroke-width="1"/>
            <!-- Dot markers around the ring -->
            <circle cx="200" cy="82" r="2.5" fill="rgba(0,230,240,0.6)"/>
            <circle cx="282" cy="118" r="2" fill="rgba(0,230,240,0.4)"/>
            <circle cx="318" cy="200" r="2.5" fill="rgba(0,230,240,0.6)"/>
            <circle cx="282" cy="282" r="2" fill="rgba(0,230,240,0.4)"/>
            <circle cx="200" cy="318" r="2.5" fill="rgba(0,230,240,0.6)"/>
            <circle cx="118" cy="282" r="2" fill="rgba(0,230,240,0.4)"/>
            <circle cx="82" cy="200" r="2.5" fill="rgba(0,230,240,0.6)"/>
            <circle cx="118" cy="118" r="2" fill="rgba(0,230,240,0.4)"/>
          </g>

          <!-- RING 1: Inner segmented bright arcs -->
          <g class="hud-ring-7" filter="url(#glowStrong)">
            <circle cx="200" cy="200" r="100" fill="none" stroke="rgba(0,230,240,0.15)" stroke-width="2" stroke-dasharray="15 8 6 8"/>
            <circle cx="200" cy="200" r="100" fill="none" stroke="rgba(0,240,250,0.6)" stroke-width="3" stroke-dasharray="30 290" stroke-linecap="round"/>
            <circle cx="200" cy="200" r="100" fill="none" stroke="rgba(0,240,250,0.4)" stroke-width="2" stroke-dasharray="20 300" stroke-dashoffset="150" stroke-linecap="round"/>
          </g>

          <!-- CORE: Innermost ring -->
          <circle cx="200" cy="200" r="75" fill="none" stroke="rgba(0,210,220,0.2)" stroke-width="1.5" filter="url(#glow)"/>
          <circle cx="200" cy="200" r="72" fill="none" stroke="rgba(0,210,220,0.08)" stroke-width="0.5"/>
        </svg>

        <!-- Center text overlay -->
        <div class="hud-center">
          <div class="hud-jarvis">J.A.R.V.I.S</div>
        </div>
      </div>

      <!-- Real greeting + clock -->
      <div class="splash-greeting" id="splash-greeting"></div>
      <div class="splash-clock" id="splash-clock"></div>
      <div class="splash-date" id="splash-date"></div>

      <!-- Live data feed -->
      <div class="splash-feed" id="splash-feed"></div>

      <!-- Bottom -->
      <div class="splash-bottom">
        <div class="splash-progress"><div class="splash-progress-bar" id="splash-progress"></div></div>
        <div class="splash-status-text" id="splash-status">INITIALIZING</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
    (function() {
      var now = new Date();
      var h = now.getHours();
      var greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      try { var u = JSON.parse(localStorage.getItem('jarvis_user')); if (u && u.name) greet += ', ' + u.name; } catch(e) {}

      var gEl = document.getElementById('splash-greeting');
      var cEl = document.getElementById('splash-clock');
      var dEl = document.getElementById('splash-date');
      if (gEl) gEl.textContent = greet;
      if (cEl) cEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      if (dEl) dEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      setInterval(function() {
        if (cEl) cEl.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }, 1000);

      var feed = document.getElementById('splash-feed');
      var progress = document.getElementById('splash-progress');
      var statusEl = document.getElementById('splash-status');
      var step = 0, totalSteps = 6;

      function setProgress(pct, label) {
        if (progress) progress.style.width = pct + '%';
        if (statusEl) { statusEl.style.opacity = '0'; setTimeout(function() { statusEl.textContent = label; statusEl.style.opacity = '1'; }, 150); }
      }

      function addFeedItem(icon, label, value) {
        if (!feed) return;
        var div = document.createElement('div');
        div.className = 'splash-feed-item';
        div.innerHTML = '<span class="splash-feed-icon">' + icon + '</span><div><div class="splash-feed-label">' + label + '</div><div class="splash-feed-value">' + value + '</div></div>';
        feed.appendChild(div);
        var items = feed.querySelectorAll('.splash-feed-item');
        if (items.length > 5) items[0].remove();
        setTimeout(function() { div.classList.add('show'); }, 30);
        step++;
        setProgress(Math.min(95, Math.round((step / totalSteps) * 100)), step >= totalSteps ? 'SYSTEMS ONLINE' : 'SCANNING');
      }

      setTimeout(function() {
        setProgress(10, 'READING WORLD CLOCKS');
        var zones = [['🗽','NY','America/New_York'],['🇬🇧','LON','Europe/London'],['🇯🇵','TYO','Asia/Tokyo'],['🌴','LA','America/Los_Angeles']];
        var parts = zones.map(function(z) {
          try { return z[0] + z[1] + ' <span class="accent">' + new Date().toLocaleTimeString('en-US',{timeZone:z[2],hour:'numeric',minute:'2-digit',hour12:true}) + '</span>'; } catch(e) { return ''; }
        }).filter(Boolean);
        addFeedItem('🌍', 'WORLD CLOCKS', parts.join(' · '));
      }, 300);

      setTimeout(function() {
        setProgress(25, 'CHECKING SCHEDULE');
        try {
          var events = JSON.parse(localStorage.getItem('jarvis_events') || '[]');
          var tasks = JSON.parse(localStorage.getItem('jarvis_tasks') || '[]');
          var todayStr = new Date().toISOString().split('T')[0];
          var te = events.filter(function(e){return e.date===todayStr;});
          var pt = tasks.filter(function(t){return !t.completed;});
          var msg = '<span class="accent">' + te.length + '</span> events · <span class="warn">' + pt.length + '</span> tasks';
          if (te.length > 0) msg += ' · ' + te.slice(0,2).map(function(e){return e.title;}).join(', ');
          addFeedItem('📋', 'TODAY', msg);
        } catch(e) { addFeedItem('📋', 'TODAY', 'No data'); }
      }, 800);

      setTimeout(function() {
        setProgress(40, 'CHECKING TRAINS');
        try {
          var sched = JSON.parse(localStorage.getItem('jarvis_trainSchedule') || '[]');
          var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
          var today = days[new Date().getDay()];
          var tt = sched.filter(function(s){return s.days && s.days.indexOf(today)>=0;});
          if (tt.length > 0) {
            addFeedItem('🚂', 'TRAINS', tt.map(function(t){return '<span class="hi">#'+t.train+'</span> '+t.boardStation;}).join(' · '));
          } else { addFeedItem('🚂', 'TRAINS', 'No trains today'); }
        } catch(e) { addFeedItem('🚂', 'TRAINS', 'No schedule'); }
      }, 1300);

      setTimeout(function() {
        setProgress(55, 'FETCHING WEATHER');
        fetch('https://wttr.in/?format=j1').then(function(r){return r.json();}).then(function(d) {
          var c = d.current_condition && d.current_condition[0];
          if (c) {
            var area = d.nearest_area && d.nearest_area[0];
            var city = area ? (area.areaName && area.areaName[0] && area.areaName[0].value) || '' : '';
            addFeedItem('🌡', 'WEATHER' + (city ? ' · ' + city.toUpperCase() : ''),
              '<span class="hi">' + c.temp_F + '°F</span> · ' + (c.weatherDesc&&c.weatherDesc[0]&&c.weatherDesc[0].value||'') +
              ' · Feels ' + c.FeelsLikeF + '°F · 💨' + c.windspeedMiles + 'mph');
          } else { addFeedItem('🌡', 'WEATHER', 'Unavailable'); }
        }).catch(function() { addFeedItem('🌡', 'WEATHER', 'Offline — retry in app'); });
      }, 1800);

      setTimeout(function() {
        setProgress(75, 'PULLING HEADLINES');
        fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fnews.google.com%2Frss%3Fhl%3Den-US%26gl%3DUS%26ceid%3DUS%3Aen')
          .then(function(r){return r.json();}).then(function(d) {
            if (d.items && d.items.length > 0) {
              addFeedItem('📰', 'HEADLINES', d.items.slice(0,3).map(function(i){return '• '+i.title.replace(/ - [^-]+$/,'');}).join('<br>'));
            } else { addFeedItem('📰', 'NEWS', 'No headlines'); }
          }).catch(function() { addFeedItem('📰', 'NEWS', 'Offline'); });
      }, 2400);

      setTimeout(function() {
        setProgress(90, 'CHECKING REMINDERS');
        try {
          var rem = JSON.parse(localStorage.getItem('jarvis_reminders') || '[]');
          var active = rem.filter(function(r){return !r.dismissed;});
          if (active.length > 0) {
            addFeedItem('⏰', 'REMINDERS', '<span class="warn">' + active.length + '</span> active · ' + (active[0].text||active[0].title||''));
          } else { addFeedItem('⏰', 'REMINDERS', 'All clear'); }
        } catch(e) { addFeedItem('⏰', 'REMINDERS', 'Clear'); }
      }, 3000);

      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          if (mutations[i].addedNodes.length > 0) {
            setProgress(100, 'ALL SYSTEMS ONLINE');
            var splash = document.getElementById('jarvis-splash');
            if (splash) {
              setTimeout(function() { splash.classList.add('hide'); }, 800);
              setTimeout(function() { splash.remove(); }, 1800);
            }
            observer.disconnect();
            break;
          }
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() { navigator.serviceWorker.register('./sw.js').catch(function(){}); });
      }
    })();
    </script>
  </body>
</html>
