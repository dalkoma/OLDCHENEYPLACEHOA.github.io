*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0f0c08;overflow-x:hidden;-webkit-tap-highlight-color:transparent;width:100%;max-width:100vw;font-family:system-ui,-apple-system,sans-serif;color:#ddd}
body{padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:env(safe-area-inset-bottom)}
@media(pointer:coarse){button,[role="button"]{min-height:40px;min-width:40px}}
.wrap{max-width:900px;margin:0 auto}
.hdr{text-align:center;padding:16px 0 8px}
h1{font-size:22px;font-weight:700;color:#fff;letter-spacing:1px}
h2{font-size:15px;font-weight:400;color:#999;margin:4px 0 0}
.sub{font-size:13px;color:#777;margin-top:6px}
.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}

.filters select option{background:#1a1a1a}
.print-btn{padding:8px 16px;background:rgba(255,255,255,0.1);border:1px solid #666;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 16px;font-size:12px;color:#999}

.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg{margin-bottom:12px;border:1px solid #333;border-radius:10px;overflow:hidden}
.seg-btn{width:100%;padding:12px 16px;background:rgba(255,255,255,0.04);border:none;color:#fff;font-size:15px;font-weight:600;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.seg-btn.active{background:rgba(255,255,255,0.08)}
.seg-sub{font-size:12px;font-weight:400;color:#888;margin-top:2px}
.badge{background:rgba(255,255,255,0.1);color:#fff;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700}
.arrow{font-size:18px;color:#666;transition:transform 0.2s;margin-left:8px}
.arrow.open{transform:rotate(180deg)}
.city-hdr{padding:6px 16px;background:rgba(255,255,255,0.06);font-size:13px;font-weight:600;color:#fff;border-top:1px solid #222;position:sticky;top:0;z-index:1}
.xing{padding:8px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px;font-size:13px}
.warn-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.xing-info{flex:1;min-width:0}
.xing-name{font-weight:700;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xing-detail{color:#888;font-size:11px}
.map-link{color:#44aaff;text-decoration:none;font-size:16px;flex-shrink:0;padding:4px 8px}
.scroll-box{max-height:70vh;overflow-y:auto}
.footer{text-align:center;padding:20px 0;font-size:11px;color:#555}
.filter-info{font-size:13px;color:#888;margin-bottom:8px}
</style>

    n++;h+=`<tr><td>${n}</td><td>${r.id}</td><td>${r.mp}</td><td>${r.street}</td><td>${r.city}</td><td>${r.county}</td><td>${r.warning}</td><td>${r.tracks}</td><td>${r.lat}</td><td>${r.lng}</td></tr>`;
  }
  const w=window.open("","_blank");w.document.write(h+"</tbody></table></body></html>");w.document.close();w.print();
}

function render(){
  const segs=getFiltered();
  const ft=segs.reduce((s,seg)=>s+seg.crossings.length,0);
  let h=`<div class="hdr"><h1>Amtrak California Zephyr</h1><h2>Railroad Crossings: DEN &rarr; FMG &rarr; MCK &rarr; HLD &rarr; HAS &rarr; LNK &rarr; OMA &rarr; CRN &rarr; OSC &rarr; OTM</h2><div class="sub">${total} grade crossings &middot; Source: FRA Crossing Inventory</div></div>`;
  h+=`<div class="filters"><input type="text" id="search" placeholder="Search street, city, or DOT ID..." value="${filterText}"><select id="warnSel">`;
  for(const w of ["All","Gates","Lights","Crossbuck","Stop Sign","Passive"])h+=`<option value="${w}"${warnFilter===w?" selected":""}>${w==="All"?"All Warnings":w}</option>`;
  h+=`</select><button class="print-btn" onclick="handlePrint()">Print</button></div>`;
  if(filterText||warnFilter!=="All")h+=`<div class="filter-info">Showing ${ft} of ${total} crossings</div>`;
  h+=`<div class="legend">`;
  for(const[type,color] of Object.entries(WARN_COLORS))h+=`<span><span class="dot" style="background:${color}"></span>${type}</span>`;
  h+=`</div>`;
  segs.forEach((seg,si)=>{
    h+=`<div class="seg"><button class="seg-btn${expanded===si?" active":""}" data-seg="${si}"><div><div>${seg.name}</div><div class="seg-sub">${seg.subdivision}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="badge">${seg.crossings.length}</span><span class="arrow${expanded===si?" open":""}">&#9660;</span></div></button>`;
    if(expanded===si){
      h+=`<div class="scroll-box">`;
      for(const[city,xings] of groupByCity(seg.crossings)){
        h+=`<div class="city-hdr">${city}, ${xings[0].county} County &mdash; ${xings.length} crossing${xings.length!==1?"s":""}</div>`;
        for(const c of xings){
          const col=WARN_COLORS[c.warning];
          h+=`<div class="xing"><span class="warn-icon" title="${c.warning}" style="background:${col}22;border:1px solid ${col};color:${col}">${WARN_ICONS[c.warning]}</span><div class="xing-info"><div class="xing-name">${c.street}</div><div class="xing-detail">DOT# ${c.id} &middot; MP ${c.mp} &middot; ${c.tracks} track${c.tracks!=="1"?"s":""}</div></div><a class="map-link" href="https://www.google.com/maps?q=${c.lat},${c.lng}" target="_blank" rel="noopener noreferrer" title="View on Google Maps">&#x1F4CD;</a></div>`;
        }
      }
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  h+=`<div class="footer">Data: FRA National Highway-Rail Crossing Inventory<br>via data.transportation.gov &middot; Public at-grade crossings only</div>`;
  document.getElementById("app").innerHTML=h;
  document.getElementById("search").addEventListener("input",e=>{filterText=e.target.value;render()});
  document.getElementById("warnSel").addEventListener("change",e=>{warnFilter=e.target.value;render()});
  document.querySelectorAll(".seg-btn").forEach(btn=>btn.addEventListener("click",()=>{const si=+btn.dataset.seg;expanded=expanded===si?null:si;render()}));
}
render();
</script>
</body>
</html>
