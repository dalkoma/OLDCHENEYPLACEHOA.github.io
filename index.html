<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="Jarvis - Your personal AI life manager with calendar, tasks, train tracking, meals, and more." />
    <title>Jarvis - Your Personal AI Assistant</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a1a; overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      }
      #root { min-height: 100vh; min-height: 100dvh; }

      /* Touch target sizing */
      @media (hover: none) and (pointer: coarse) {
        button, a, [role="button"], input, select, textarea {
          min-height: 40px;
        }
      }

      /* High DPI / Retina displays */
      @media (resolution >= 2dppx) {
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      }

      @media (orientation: landscape) {
        #root { transition: none; }
      }

      /* ===== JARVIS BOOT SPLASH ===== */
      #jarvis-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #0a0a1a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #jarvis-splash.hide {
        opacity: 0; visibility: hidden; pointer-events: none;
      }

      /* Orb container */
      .splash-orb-wrap {
        position: relative;
        width: 200px; height: 200px;
        margin-bottom: 40px;
      }

      /* Expanding rings */
      .splash-ring {
        position: absolute; top: 50%; left: 50%;
        border-radius: 50%;
        border: 1px solid rgba(108, 92, 231, 0.15);
        transform: translate(-50%, -50%) scale(0.3);
        animation: ringExpand 3s ease-out infinite;
      }
      .splash-ring:nth-child(1) { width: 300px; height: 300px; animation-delay: 0s; }
      .splash-ring:nth-child(2) { width: 400px; height: 400px; animation-delay: 0.5s; }
      .splash-ring:nth-child(3) { width: 520px; height: 520px; animation-delay: 1s; }
      .splash-ring:nth-child(4) { width: 660px; height: 660px; animation-delay: 1.5s; }
      .splash-ring:nth-child(5) { width: 820px; height: 820px; animation-delay: 2s; }

      @keyframes ringExpand {
        0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
        20% { opacity: 0.5; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
      }

      /* Orbiting dots */
      .splash-orbit {
        position: absolute; top: 50%; left: 50%;
        width: 160px; height: 160px;
        transform: translate(-50%, -50%);
        animation: orbitSpin 4s linear infinite;
      }
      .splash-orbit:nth-child(7) {
        width: 120px; height: 120px;
        animation: orbitSpin 3s linear infinite reverse;
      }
      .splash-orbit:nth-child(8) {
        width: 200px; height: 200px;
        animation: orbitSpin 5s linear infinite;
      }
      .splash-orbit-dot {
        position: absolute; width: 6px; height: 6px;
        border-radius: 50%; background: #6c5ce7;
        box-shadow: 0 0 8px rgba(108, 92, 231, 0.6);
      }
      .splash-orbit:nth-child(7) .splash-orbit-dot { background: #00cec9; box-shadow: 0 0 8px rgba(0, 206, 201, 0.6); width: 4px; height: 4px; }
      .splash-orbit:nth-child(8) .splash-orbit-dot { background: #a29bfe; box-shadow: 0 0 8px rgba(162, 155, 254, 0.4); width: 5px; height: 5px; }

      @keyframes orbitSpin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

      /* Glow halos behind orb */
      .splash-glow {
        position: absolute; top: 50%; left: 50%;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        filter: blur(30px);
      }
      .splash-glow-1 {
        width: 140px; height: 140px;
        background: radial-gradient(circle, rgba(108, 92, 231, 0.35), transparent 70%);
        animation: glowPulse 2s ease-in-out infinite;
      }
      .splash-glow-2 {
        width: 200px; height: 200px;
        background: radial-gradient(circle, rgba(0, 206, 201, 0.12), transparent 70%);
        animation: glowPulse 2.5s ease-in-out infinite 0.5s;
      }
      .splash-glow-3 {
        width: 260px; height: 260px;
        background: radial-gradient(circle, rgba(162, 155, 254, 0.08), transparent 70%);
        animation: glowPulse 3s ease-in-out infinite 1s;
      }
      @keyframes glowPulse { 0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }

      /* Center orb */
      .splash-orb {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 80px; height: 80px; border-radius: 50%;
        background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        display: flex; align-items: center; justify-content: center;
        font-size: 36px; color: #fff;
        box-shadow: 0 0 40px rgba(108, 92, 231, 0.5), 0 0 80px rgba(108, 92, 231, 0.2);
        animation: orbBreathe 2s ease-in-out infinite;
        z-index: 2;
      }
      @keyframes orbBreathe { 0%, 100% { box-shadow: 0 0 40px rgba(108,92,231,0.5), 0 0 80px rgba(108,92,231,0.2); } 50% { box-shadow: 0 0 60px rgba(108,92,231,0.7), 0 0 120px rgba(108,92,231,0.3); } }

      /* Inner orb ring */
      .splash-orb-ring {
        position: absolute; top: 50%; left: 50%;
        width: 100px; height: 100px; border-radius: 50%;
        border: 1.5px solid rgba(162, 155, 254, 0.4);
        transform: translate(-50%, -50%);
        animation: orbRingPulse 2s ease-in-out infinite;
        z-index: 1;
      }
      .splash-orb-ring-2 {
        width: 120px; height: 120px;
        border-color: rgba(108, 92, 231, 0.2);
        animation-delay: 0.3s;
      }
      @keyframes orbRingPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; } 50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; } }

      /* Text */
      .splash-title {
        color: #f0f0ff; font-size: 28px; font-weight: 700;
        letter-spacing: 4px; margin-bottom: 8px;
        animation: textFadeIn 1s ease 0.3s both;
      }
      .splash-subtitle {
        color: #8888aa; font-size: 13px; font-weight: 400;
        letter-spacing: 2px;
        animation: textFadeIn 1s ease 0.6s both;
      }
      @keyframes textFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      /* Boot status line */
      .splash-status {
        position: absolute; bottom: 60px;
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        animation: textFadeIn 1s ease 1s both;
      }
      .splash-status-text {
        color: #555577; font-size: 11px; letter-spacing: 1px;
        animation: statusCycle 4s ease infinite;
      }
      @keyframes statusCycle {
        0%, 20% { content: ''; }
        25% { opacity: 0; }
        30%, 100% { opacity: 1; }
      }
      .splash-progress {
        width: 120px; height: 2px; background: #1a1a3a; border-radius: 1px; overflow: hidden;
      }
      .splash-progress-bar {
        height: 100%; width: 0; border-radius: 1px;
        background: linear-gradient(90deg, #6c5ce7, #a29bfe, #00cec9);
        animation: progressFill 2.5s ease-out forwards;
      }
      @keyframes progressFill { to { width: 100%; } }

      /* Floating particles */
      .splash-particle {
        position: absolute; border-radius: 50%;
        background: rgba(108, 92, 231, 0.3);
        animation: particleFloat linear infinite;
      }
      @keyframes particleFloat {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <!-- Jarvis Boot Splash -->
    <div id="jarvis-splash" aria-label="Loading Jarvis">
      <!-- Floating particles -->
      <div class="splash-particle" style="width:3px;height:3px;left:10%;bottom:-10px;animation-duration:6s;animation-delay:0s;"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:25%;bottom:-10px;animation-duration:8s;animation-delay:1s;"></div>
      <div class="splash-particle" style="width:4px;height:4px;left:45%;bottom:-10px;animation-duration:7s;animation-delay:0.5s;background:rgba(0,206,201,0.2);"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:65%;bottom:-10px;animation-duration:9s;animation-delay:2s;"></div>
      <div class="splash-particle" style="width:3px;height:3px;left:80%;bottom:-10px;animation-duration:6.5s;animation-delay:1.5s;background:rgba(162,155,254,0.3);"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:90%;bottom:-10px;animation-duration:7.5s;animation-delay:0.8s;"></div>
      <div class="splash-particle" style="width:3px;height:3px;left:35%;bottom:-10px;animation-duration:8.5s;animation-delay:2.5s;background:rgba(0,206,201,0.15);"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:55%;bottom:-10px;animation-duration:7s;animation-delay:3s;"></div>

      <!-- Orb assembly -->
      <div class="splash-orb-wrap">
        <!-- Expanding rings (sonar-like) -->
        <div class="splash-ring"></div>
        <div class="splash-ring"></div>
        <div class="splash-ring"></div>
        <div class="splash-ring"></div>
        <div class="splash-ring"></div>

        <!-- Orbiting dots -->
        <div class="splash-orbit">
          <div class="splash-orbit-dot" style="top:0;left:50%;transform:translateX(-50%);"></div>
          <div class="splash-orbit-dot" style="bottom:0;left:50%;transform:translateX(-50%);"></div>
        </div>
        <div class="splash-orbit">
          <div class="splash-orbit-dot" style="top:50%;left:0;transform:translateY(-50%);"></div>
          <div class="splash-orbit-dot" style="top:50%;right:0;transform:translateY(-50%);"></div>
        </div>
        <div class="splash-orbit">
          <div class="splash-orbit-dot" style="top:0;left:50%;transform:translateX(-50%);"></div>
          <div class="splash-orbit-dot" style="bottom:0;right:0;"></div>
        </div>

        <!-- Glow halos -->
        <div class="splash-glow splash-glow-3"></div>
        <div class="splash-glow splash-glow-2"></div>
        <div class="splash-glow splash-glow-1"></div>

        <!-- Inner rings around orb -->
        <div class="splash-orb-ring"></div>
        <div class="splash-orb-ring splash-orb-ring-2"></div>

        <!-- The orb itself -->
        <div class="splash-orb">◉</div>
      </div>

      <!-- Title -->
      <div class="splash-title">JARVIS</div>
      <div class="splash-subtitle">INITIALIZING AI SYSTEMS</div>

      <!-- Boot status -->
      <div class="splash-status">
        <div class="splash-progress"><div class="splash-progress-bar"></div></div>
        <div class="splash-status-text" id="splash-status-text">LOADING MODULES</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Cycle boot status messages
      (function() {
        var msgs = ['LOADING MODULES', 'CONNECTING SYSTEMS', 'CALIBRATING AI', 'SYNCING DATA', 'READY'];
        var idx = 0;
        var el = document.getElementById('splash-status-text');
        if (!el) return;
        var iv = setInterval(function() {
          idx++;
          if (idx >= msgs.length) { clearInterval(iv); return; }
          el.style.opacity = '0';
          setTimeout(function() { el.textContent = msgs[idx]; el.style.opacity = '1'; }, 200);
        }, 600);
      })();

      // Hide splash when React mounts
      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          if (mutations[i].addedNodes.length > 0) {
            var splash = document.getElementById('jarvis-splash');
            if (splash) {
              // Small delay so the "READY" message shows
              setTimeout(function() { splash.classList.add('hide'); }, 400);
              setTimeout(function() { splash.remove(); }, 1200);
            }
            observer.disconnect();
            break;
          }
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
