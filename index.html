<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="Jarvis - Your personal AI life manager with calendar, tasks, train tracking, meals, and more." />
    <title>Jarvis - Your Personal AI Assistant</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a1a; overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      @media (hover: none) and (pointer: coarse) {
        button, a, [role="button"], input, select, textarea { min-height: 40px; }
      }
      @media (resolution >= 2dppx) {
        * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      }
      @media (orientation: landscape) { #root { transition: none; } }

      /* ===== JARVIS BOOT SPLASH ===== */
      #jarvis-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #0a0a1a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        overflow: hidden;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #jarvis-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }

      /* Orb container */
      .splash-orb-wrap {
        position: relative; width: 180px; height: 180px;
        margin-bottom: 28px; flex-shrink: 0;
      }

      /* Expanding rings */
      .splash-ring {
        position: absolute; top: 50%; left: 50%; border-radius: 50%;
        border: 1px solid rgba(108, 92, 231, 0.15);
        transform: translate(-50%, -50%) scale(0.3);
        animation: ringExpand 3s ease-out infinite;
      }
      .splash-ring:nth-child(1) { width: 280px; height: 280px; animation-delay: 0s; }
      .splash-ring:nth-child(2) { width: 380px; height: 380px; animation-delay: 0.5s; }
      .splash-ring:nth-child(3) { width: 500px; height: 500px; animation-delay: 1s; }
      .splash-ring:nth-child(4) { width: 640px; height: 640px; animation-delay: 1.5s; }
      .splash-ring:nth-child(5) { width: 800px; height: 800px; animation-delay: 2s; }
      @keyframes ringExpand {
        0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
        20% { opacity: 0.5; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
      }

      /* Orbiting dots */
      .splash-orbit {
        position: absolute; top: 50%; left: 50%;
        width: 150px; height: 150px;
        transform: translate(-50%, -50%);
        animation: orbitSpin 4s linear infinite;
      }
      .splash-orbit:nth-child(7) { width: 110px; height: 110px; animation: orbitSpin 3s linear infinite reverse; }
      .splash-orbit:nth-child(8) { width: 190px; height: 190px; animation: orbitSpin 5s linear infinite; }
      .splash-orbit-dot {
        position: absolute; width: 5px; height: 5px; border-radius: 50%;
        background: #6c5ce7; box-shadow: 0 0 8px rgba(108,92,231,0.6);
      }
      .splash-orbit:nth-child(7) .splash-orbit-dot { background: #00cec9; box-shadow: 0 0 8px rgba(0,206,201,0.6); width: 4px; height: 4px; }
      .splash-orbit:nth-child(8) .splash-orbit-dot { background: #a29bfe; box-shadow: 0 0 8px rgba(162,155,254,0.4); width: 4px; height: 4px; }
      @keyframes orbitSpin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

      /* Glow halos */
      .splash-glow { position: absolute; top: 50%; left: 50%; border-radius: 50%; transform: translate(-50%, -50%); filter: blur(30px); }
      .splash-glow-1 { width: 130px; height: 130px; background: radial-gradient(circle, rgba(108,92,231,0.35), transparent 70%); animation: glowPulse 2s ease-in-out infinite; }
      .splash-glow-2 { width: 180px; height: 180px; background: radial-gradient(circle, rgba(0,206,201,0.12), transparent 70%); animation: glowPulse 2.5s ease-in-out infinite 0.5s; }
      .splash-glow-3 { width: 240px; height: 240px; background: radial-gradient(circle, rgba(162,155,254,0.08), transparent 70%); animation: glowPulse 3s ease-in-out infinite 1s; }
      @keyframes glowPulse { 0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }

      /* Center orb */
      .splash-orb {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 72px; height: 72px; border-radius: 50%;
        background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; color: #fff;
        box-shadow: 0 0 40px rgba(108,92,231,0.5), 0 0 80px rgba(108,92,231,0.2);
        animation: orbBreathe 2s ease-in-out infinite; z-index: 2;
      }
      @keyframes orbBreathe { 0%, 100% { box-shadow: 0 0 40px rgba(108,92,231,0.5), 0 0 80px rgba(108,92,231,0.2); } 50% { box-shadow: 0 0 60px rgba(108,92,231,0.7), 0 0 120px rgba(108,92,231,0.3); } }

      .splash-orb-ring {
        position: absolute; top: 50%; left: 50%;
        width: 94px; height: 94px; border-radius: 50%;
        border: 1.5px solid rgba(162,155,254,0.4);
        transform: translate(-50%, -50%);
        animation: orbRingPulse 2s ease-in-out infinite; z-index: 1;
      }
      .splash-orb-ring-2 { width: 114px; height: 114px; border-color: rgba(108,92,231,0.2); animation-delay: 0.3s; }
      @keyframes orbRingPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; } 50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; } }

      /* Particles */
      .splash-particle {
        position: absolute; border-radius: 50%; background: rgba(108,92,231,0.3);
        animation: particleFloat linear infinite;
      }
      @keyframes particleFloat {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        10% { opacity: 1; } 90% { opacity: 1; }
        100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
      }

      /* Title area */
      .splash-greeting { color: #f0f0ff; font-size: 22px; font-weight: 700; margin-bottom: 4px; animation: textIn 0.8s ease 0.2s both; }
      .splash-clock { color: #a29bfe; font-size: 42px; font-weight: 300; letter-spacing: 2px; margin-bottom: 4px; font-variant-numeric: tabular-nums; animation: textIn 0.8s ease 0.4s both; }
      .splash-date { color: #555577; font-size: 13px; margin-bottom: 24px; animation: textIn 0.8s ease 0.5s both; }
      @keyframes textIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

      /* Live data feed */
      .splash-feed {
        width: 90%; max-width: 420px;
        display: flex; flex-direction: column; gap: 6px;
        margin-bottom: 20px;
      }
      .splash-feed-item {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 14px; border-radius: 10px;
        background: rgba(18,18,42,0.8); border: 1px solid #2a2a4a;
        opacity: 0; transform: translateX(-20px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .splash-feed-item.show { opacity: 1; transform: translateX(0); }
      .splash-feed-icon { font-size: 16px; flex-shrink: 0; width: 24px; text-align: center; }
      .splash-feed-label { color: #555577; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
      .splash-feed-value { color: #f0f0ff; font-size: 12px; line-height: 1.4; }
      .splash-feed-value .hi { color: #00cec9; }
      .splash-feed-value .warn { color: #fdcb6e; }
      .splash-feed-value .accent { color: #a29bfe; }

      /* Bottom progress */
      .splash-bottom {
        position: absolute; bottom: 40px;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        animation: textIn 0.8s ease 0.8s both;
      }
      .splash-progress { width: 140px; height: 2px; background: #1a1a3a; border-radius: 1px; overflow: hidden; }
      .splash-progress-bar {
        height: 100%; width: 0; border-radius: 1px;
        background: linear-gradient(90deg, #6c5ce7, #a29bfe, #00cec9);
        transition: width 0.3s ease;
      }
      .splash-status-text { color: #555577; font-size: 10px; letter-spacing: 1px; transition: opacity 0.2s; }
    </style>
  </head>
  <body>
    <!-- Jarvis Boot Splash -->
    <div id="jarvis-splash" aria-label="Loading Jarvis">
      <!-- Particles -->
      <div class="splash-particle" style="width:3px;height:3px;left:10%;bottom:-10px;animation-duration:6s;animation-delay:0s;"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:25%;bottom:-10px;animation-duration:8s;animation-delay:1s;"></div>
      <div class="splash-particle" style="width:4px;height:4px;left:45%;bottom:-10px;animation-duration:7s;animation-delay:0.5s;background:rgba(0,206,201,0.2);"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:65%;bottom:-10px;animation-duration:9s;animation-delay:2s;"></div>
      <div class="splash-particle" style="width:3px;height:3px;left:80%;bottom:-10px;animation-duration:6.5s;animation-delay:1.5s;background:rgba(162,155,254,0.3);"></div>
      <div class="splash-particle" style="width:2px;height:2px;left:55%;bottom:-10px;animation-duration:7s;animation-delay:3s;"></div>

      <!-- Orb -->
      <div class="splash-orb-wrap">
        <div class="splash-ring"></div><div class="splash-ring"></div><div class="splash-ring"></div><div class="splash-ring"></div><div class="splash-ring"></div>
        <div class="splash-orbit">
          <div class="splash-orbit-dot" style="top:0;left:50%;transform:translateX(-50%);"></div>
          <div class="splash-orbit-dot" style="bottom:0;left:50%;transform:translateX(-50%);"></div>
        </div>
        <div class="splash-orbit">
          <div class="splash-orbit-dot" style="top:50%;left:0;transform:translateY(-50%);"></div>
          <div class="splash-orbit-dot" style="top:50%;right:0;transform:translateY(-50%);"></div>
        </div>
        <div class="splash-orbit">
          <div class="splash-orbit-dot" style="top:0;left:50%;transform:translateX(-50%);"></div>
          <div class="splash-orbit-dot" style="bottom:0;right:0;"></div>
        </div>
        <div class="splash-glow splash-glow-3"></div>
        <div class="splash-glow splash-glow-2"></div>
        <div class="splash-glow splash-glow-1"></div>
        <div class="splash-orb-ring"></div>
        <div class="splash-orb-ring splash-orb-ring-2"></div>
        <div class="splash-orb">◉</div>
      </div>

      <!-- Real greeting + clock -->
      <div class="splash-greeting" id="splash-greeting"></div>
      <div class="splash-clock" id="splash-clock"></div>
      <div class="splash-date" id="splash-date"></div>

      <!-- Live data feed -->
      <div class="splash-feed" id="splash-feed"></div>

      <!-- Bottom progress -->
      <div class="splash-bottom">
        <div class="splash-progress"><div class="splash-progress-bar" id="splash-progress"></div></div>
        <div class="splash-status-text" id="splash-status">CONNECTING</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
    (function() {
      // ---- REAL TIME ----
      var now = new Date();
      var h = now.getHours();
      var greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      // Try to get user name from localStorage
      try {
        var u = JSON.parse(localStorage.getItem('jarvis_user'));
        if (u && u.name) greet += ', ' + u.name;
      } catch(e) {}

      var gEl = document.getElementById('splash-greeting');
      var cEl = document.getElementById('splash-clock');
      var dEl = document.getElementById('splash-date');
      if (gEl) gEl.textContent = greet;
      if (cEl) cEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      if (dEl) dEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      // Keep clock ticking
      setInterval(function() {
        if (cEl) cEl.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }, 1000);

      // ---- LIVE DATA FEED ----
      var feed = document.getElementById('splash-feed');
      var progress = document.getElementById('splash-progress');
      var statusEl = document.getElementById('splash-status');
      var feedItems = [];
      var step = 0;
      var totalSteps = 6;

      function setProgress(pct, label) {
        if (progress) progress.style.width = pct + '%';
        if (statusEl) { statusEl.style.opacity = '0'; setTimeout(function() { statusEl.textContent = label; statusEl.style.opacity = '1'; }, 150); }
      }

      function addFeedItem(icon, label, value) {
        if (!feed) return;
        var div = document.createElement('div');
        div.className = 'splash-feed-item';
        div.innerHTML = '<span class="splash-feed-icon">' + icon + '</span><div><div class="splash-feed-label">' + label + '</div><div class="splash-feed-value">' + value + '</div></div>';
        feed.appendChild(div);
        // Keep max 5 items, remove oldest
        var items = feed.querySelectorAll('.splash-feed-item');
        if (items.length > 5) items[0].remove();
        setTimeout(function() { div.classList.add('show'); }, 30);
        step++;
        setProgress(Math.min(95, Math.round((step / totalSteps) * 100)), step >= totalSteps ? 'READY' : 'LOADING LIVE DATA');
      }

      // Step 1: World clocks (immediate)
      setTimeout(function() {
        setProgress(10, 'READING WORLD CLOCKS');
        var zones = [
          ['🗽', 'New York', 'America/New_York'],
          ['🇬🇧', 'London', 'Europe/London'],
          ['🇯🇵', 'Tokyo', 'Asia/Tokyo'],
          ['🌴', 'Los Angeles', 'America/Los_Angeles'],
        ];
        var parts = zones.map(function(z) {
          try {
            var t = new Date().toLocaleTimeString('en-US', { timeZone: z[2], hour: 'numeric', minute: '2-digit', hour12: true });
            return z[0] + ' ' + z[1] + ' <span class="accent">' + t + '</span>';
          } catch(e) { return ''; }
        }).filter(Boolean);
        addFeedItem('🌍', 'WORLD CLOCKS', parts.join(' &nbsp;·&nbsp; '));
      }, 300);

      // Step 2: Local tasks/events from localStorage (immediate)
      setTimeout(function() {
        setProgress(25, 'CHECKING YOUR SCHEDULE');
        try {
          var events = JSON.parse(localStorage.getItem('jarvis_events') || '[]');
          var tasks = JSON.parse(localStorage.getItem('jarvis_tasks') || '[]');
          var todayStr = new Date().toISOString().split('T')[0];
          var todayEvents = events.filter(function(e) { return e.date === todayStr; });
          var pendingTasks = tasks.filter(function(t) { return !t.completed; });
          var msg = '<span class="accent">' + todayEvents.length + '</span> events today · <span class="warn">' + pendingTasks.length + '</span> pending tasks';
          if (todayEvents.length > 0) msg += '<br>' + todayEvents.slice(0, 2).map(function(e) { return e.title + (e.time ? ' at ' + e.time : ''); }).join(', ');
          addFeedItem('📋', 'YOUR DAY', msg);
        } catch(e) {
          addFeedItem('📋', 'YOUR DAY', 'Calendar clear · No pending tasks');
        }
      }, 800);

      // Step 3: Train schedule from localStorage
      setTimeout(function() {
        setProgress(40, 'CHECKING TRAINS');
        try {
          var sched = JSON.parse(localStorage.getItem('jarvis_trainSchedule') || '[]');
          var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
          var today = days[new Date().getDay()];
          var todayTrains = sched.filter(function(s) { return s.days && s.days.indexOf(today) >= 0; });
          if (todayTrains.length > 0) {
            var msg = todayTrains.map(function(t) {
              return '<span class="hi">#' + t.train + '</span> ' + (t.direction || '') + ' · Board at ' + (t.boardStation || '?');
            }).join('<br>');
            addFeedItem('🚂', 'YOUR TRAINS TODAY', msg);
          } else {
            addFeedItem('🚂', 'TRAINS', 'No trains on your schedule today');
          }
        } catch(e) {
          addFeedItem('🚂', 'TRAINS', 'No schedule configured');
        }
      }, 1300);

      // Step 4: LIVE weather from API
      setTimeout(function() {
        setProgress(55, 'FETCHING LIVE WEATHER');
        fetch('https://wttr.in/?format=j1')
          .then(function(r) { return r.json(); })
          .then(function(d) {
            var c = d.current_condition && d.current_condition[0];
            if (c) {
              var area = d.nearest_area && d.nearest_area[0];
              var city = area ? (area.areaName && area.areaName[0] && area.areaName[0].value) || 'Your area' : 'Your area';
              var codes = { '113': '☀️', '116': '⛅', '119': '☁️', '122': '☁️', '176': '🌦', '200': '⛈', '227': '🌨', '248': '🌫' };
              var emoji = codes[c.weatherCode] || '🌤';
              addFeedItem('🌡', 'LIVE WEATHER · ' + city.toUpperCase(),
                emoji + ' <span class="hi">' + c.temp_F + '°F</span> · ' + (c.weatherDesc && c.weatherDesc[0] && c.weatherDesc[0].value || '') +
                ' · Feels ' + c.FeelsLikeF + '°F · 💧 ' + c.humidity + '% · 💨 ' + c.windspeedMiles + 'mph'
              );
            } else {
              addFeedItem('🌡', 'WEATHER', 'Data unavailable');
            }
          })
          .catch(function() {
            addFeedItem('🌡', 'WEATHER', 'Could not connect — will retry in app');
          });
      }, 1800);

      // Step 5: LIVE news from API
      setTimeout(function() {
        setProgress(75, 'PULLING HEADLINES');
        fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fnews.google.com%2Frss%3Fhl%3Den-US%26gl%3DUS%26ceid%3DUS%3Aen')
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d.items && d.items.length > 0) {
              var headlines = d.items.slice(0, 3).map(function(item) {
                var title = item.title ? item.title.replace(/ - [^-]+$/, '') : '';
                return '• ' + title;
              }).join('<br>');
              addFeedItem('📰', 'TOP HEADLINES', headlines);
            } else {
              addFeedItem('📰', 'NEWS', 'No headlines available');
            }
          })
          .catch(function() {
            addFeedItem('📰', 'NEWS', 'Could not fetch — will load in app');
          });
      }, 2400);

      // Step 6: Reminders check
      setTimeout(function() {
        setProgress(90, 'CHECKING REMINDERS');
        try {
          var reminders = JSON.parse(localStorage.getItem('jarvis_reminders') || '[]');
          var active = reminders.filter(function(r) { return !r.dismissed; });
          if (active.length > 0) {
            var msg = '<span class="warn">' + active.length + '</span> active reminder' + (active.length > 1 ? 's' : '') +
              ' · Next: ' + (active[0].text || active[0].title || 'Untitled');
            addFeedItem('⏰', 'REMINDERS', msg);
          } else {
            addFeedItem('⏰', 'REMINDERS', 'No active reminders');
          }
        } catch(e) {
          addFeedItem('⏰', 'REMINDERS', 'All clear');
        }
      }, 3000);

      // ---- HIDE SPLASH WHEN REACT MOUNTS ----
      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          if (mutations[i].addedNodes.length > 0) {
            // Let user see the data for a moment
            setProgress(100, 'ALL SYSTEMS ONLINE');
            var splash = document.getElementById('jarvis-splash');
            if (splash) {
              setTimeout(function() { splash.classList.add('hide'); }, 800);
              setTimeout(function() { splash.remove(); }, 1800);
            }
            observer.disconnect();
            break;
          }
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function() {});
        });
      }
    })();
    </script>
  </body>
</html>
